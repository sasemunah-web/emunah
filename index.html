<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Emunáh</title>
<style>
:root{--verde:#2e7d32;--verde-claro:#e8f5e9;--naranja:#ef6c00;--naranja-claro:#fff3e0;--morado:#6a1b9a;--morado-claro:#f3e5f5;--texto:#1f2937;--gris:#6b7280;--borde:#e5e7eb;--fondo:#f7f7f4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fondo);color:var(--texto)}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:#fff;background:linear-gradient(135deg,var(--verde),var(--morado))}
header b{font-size:18px;display:block}
header small{opacity:.85}
main{padding:12px 12px 100px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:#fff;border-top:1px solid var(--borde);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1 0 58px;min-width:58px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border:0;border-top:3px solid transparent;background:none;font-size:11px;color:var(--gris);font-weight:600}
nav button span{font-size:18px;line-height:1}
nav button.on{color:var(--morado);border-top-color:var(--naranja)}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid var(--borde);border-radius:10px;font-size:16px;background:#fff;color:var(--texto);font-family:inherit}
.btn{width:100%;padding:13px;margin:8px 0;border:0;border-radius:10px;background:var(--verde);color:#fff;font-size:16px;font-weight:700}
.btn:disabled{opacity:.5}
.btn.chico{width:auto;margin:0;padding:9px 14px;font-size:14px}
.ghost{display:inline-block;padding:9px 14px;border:1px solid currentColor;border-radius:10px;background:none;color:var(--morado);font-size:14px;text-decoration:none;font-family:inherit}
header .ghost{color:#fff}
.danger{width:100%;padding:12px;margin:6px 0;border:1px solid #c62828;border-radius:10px;background:#fff;color:#c62828;font-size:15px}
.card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:12px;margin:8px 0}
.card h3,main h3{margin:4px 0 8px;font-size:16px}
.prod{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.prod small,.venta small{display:block;color:var(--gris);margin-top:2px}
.prod.sin{opacity:.5}
.prod.bajo small{color:var(--naranja);font-weight:600}
.precio{font-weight:700;color:var(--verde);text-align:right;white-space:nowrap}
.badge{display:inline-block;margin-left:8px;min-width:22px;padding:2px 7px;border-radius:99px;background:var(--naranja);color:#fff;font-size:13px;text-align:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.chip{flex:none;padding:7px 13px;border:1px solid var(--borde);border-radius:99px;background:#fff;font-size:14px;color:var(--texto)}
.chip.on{background:var(--morado);border-color:var(--morado);color:#fff}
#carrito{position:sticky;bottom:64px;margin-top:12px;z-index:4}
.cart{background:#fff;border:2px solid var(--naranja);border-radius:14px;padding:12px;box-shadow:0 -4px 14px rgba(0,0,0,.1)}
.fila{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--borde);font-size:14px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border:1px solid var(--borde);border-radius:8px;background:#fff;font-size:18px;line-height:1}
.total{display:flex;justify-content:space-between;font-size:18px;margin:10px 0 4px;color:var(--naranja)}
.row{display:flex;gap:8px;align-items:center}
.row input{margin:6px 0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.kpi{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:12px}
.kpi.grande{grid-column:1/-1;background:linear-gradient(135deg,var(--verde),var(--morado));color:#fff;border:0}
.kpi small{display:block;opacity:.8;font-size:12px}
.kpi b{font-size:20px}
.kpi.grande b{font-size:30px}
.lin{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--borde);font-size:14px}
.lin:last-child{border-bottom:0}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--morado-claro);color:var(--morado);margin-left:6px}
.pill.off{background:#fee2e2;color:#b91c1c}
.pill.ok{background:var(--verde-claro);color:var(--verde)}
.pill.warn{background:var(--naranja-claro);color:var(--naranja)}
.vacio{text-align:center;color:var(--gris);padding:24px 8px}
.login{max-width:380px;margin:0 auto;padding:36px 20px;text-align:center}
.logo{width:72px;height:72px;margin:0 auto 8px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--verde),var(--morado));border-bottom:6px solid var(--naranja)}
.login h1{margin:6px 0 0;color:var(--morado)}
.sub{color:var(--gris);margin:4px 0 16px}
.err{color:#c62828;min-height:20px;font-size:14px;margin:6px 0}
hr{border:0;border-top:1px solid var(--borde);margin:24px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px;max-height:92vh;overflow:auto}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.on{opacity:1}
.factura{font-size:14px}
.fhead{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--verde),var(--morado));border-bottom:5px solid var(--naranja);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.flogo{width:44px;height:44px;flex:none;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.fh1{flex:1}.fh1 b{display:block;font-size:20px}.fh1 span,.fh2 span{font-size:12px;opacity:.9}
.fh2{text-align:right}.fh2 b{display:block;font-size:15px}
.fcli{display:flex;justify-content:space-between;gap:12px;padding:14px 2px}
.fcli small{display:block;color:var(--gris);font-size:11px;font-weight:700;letter-spacing:.5px}
.fcli b{display:block;font-size:17px;margin:2px 0}
.fcli span{display:block;font-size:13px}
.ft{width:100%;border-collapse:collapse}
.ft th{background:var(--morado-claro);color:var(--morado);text-align:left;padding:8px;font-size:11px;letter-spacing:.4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ft td{padding:8px;border-bottom:1px solid var(--borde);vertical-align:top}
.ft tbody tr:nth-child(even) td{background:#faf7fb}
.ft .n{text-align:right;white-space:nowrap}
.ft thead{display:table-header-group}.ft tr{break-inside:avoid;page-break-inside:avoid}
.ftot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 6px;color:var(--gris);font-size:13px}
.ftb{background:var(--naranja-claro);border-radius:12px;padding:10px 16px;text-align:right;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ftb small{display:block;color:var(--naranja);font-weight:700;font-size:11px}.ftb b{font-size:24px;color:var(--naranja)}
.fpie{text-align:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--borde);font-weight:800;color:var(--morado);font-size:16px}
.fpie small{display:block;font-weight:400;color:var(--gris);font-size:12px;margin-top:4px}
.acciones .btn{padding:11px;margin:0 0 6px;font-size:15px}.acciones .ghost{padding:9px 6px;font-size:14px}
.acciones{position:sticky;bottom:0;background:#fff;padding:10px 0 4px;margin-top:12px;border-top:1px solid var(--borde)}
@page{margin:10mm}
@media print{body{background:#fff}#app,#toast,.noprint{display:none!important}.modal{position:static;background:#fff}.sheet{max-height:none;overflow:visible;border-radius:0;padding:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, collection, query, where, getDocs, onSnapshot, writeBatch, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============ 1) PEGA AQUÍ LAS CLAVES DE TU PROYECTO FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyDLyoxPpBtvCQprn37KQ-Wfx-gQBLVGSKY",
  authDomain: "emunah-aa4b8.firebaseapp.com",
  projectId: "emunah-aa4b8",
  storageBucket: "emunah-aa4b8.firebasestorage.app",
  messagingSenderId: "898228583964",
  appId: "1:898228583964:web:3bdfa388453305788ce9d9"
};
/* ========================================================================= */

const NEGOCIO = "Emunáh";
const DEF_CATS = ["Comida", "Dulcería", "Atunes", "Aceites", "Traperos", "Otros"];
const METODOS = ["Efectivo", "Nequi", "Daviplata", "Transferencia", "Otro"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => new Intl.NumberFormat("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 }).format(n || 0);
const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const hora = ts => new Date(ts).toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });
const fh = ts => new Date(ts).toLocaleString("es-CO", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
const cod = p => String(p.id || "").slice(0, 6).toUpperCase();
const sum = a => a.reduce((t, x) => t + (x.total || 0), 0);
const pantalla = html => { $("#app").innerHTML = html; };
const esJefe = () => S.perfil && S.perfil.role === "jefe";
const cats = () => [...new Set([...DEF_CATS, ...S.productos.map(p => p.categoria).filter(Boolean)])];
const mapa = p => p.lat != null ? `https://www.google.com/maps?q=${p.lat},${p.lng}` : (p.direccion ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.direccion)}` : "");
const pillEstado = p => p.estado === "pendiente" ? '<span class="pill warn">Pendiente</span>'
  : p.estado === "cancelado" ? '<span class="pill off">Cancelado</span>'
  : p.saldo > 0 ? `<span class="pill warn">Debe ${money(p.saldo)}</span>` : '<span class="pill ok">Pagado</span>';

let toastT;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("on"), 3000);
}

function errAuth(e) {
  const c = (e && e.code) || "";
  if (c === "ya-existe") return "Ese correo ya existe en Firebase. Escribe la clave que tenía antes o bórralo en Firebase → Authentication.";
  if (c === "ya-en-equipo") return "Esa persona ya está en el equipo.";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return "Correo o clave incorrectos.";
  if (c.includes("email-already-in-use")) return "Ese correo ya está registrado.";
  if (c.includes("weak-password")) return "La clave debe tener mínimo 6 caracteres.";
  if (c.includes("invalid-email")) return "Correo no válido.";
  if (c.includes("too-many-requests")) return "Demasiados intentos. Espera un momento.";
  if (c.includes("network")) return "Sin conexión a internet.";
  if (c.includes("permission-denied")) return "Sin permisos: revisa que las reglas de Firestore estén publicadas.";
  return "Error: " + ((e && e.message) || c);
}

const S = {
  perfil: null, productos: [], clientes: [], carrito: {}, clienteSel: "", nota: "",
  tab: "pedido", fecha: hoy(), busca: "", cat: "Todas", pbusca: "", pcat: "Todas",
  cbusca: "", pend: [], docsCierre: [], registrando: false, unsub: null
};
let auth, db;

function modal(html) {
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="sheet">${html}</div>`;
  m.onclick = e => { if (e.target === m) m.remove(); };
  document.body.appendChild(m);
  return m;
}

/* ---------------------------- LOGIN ---------------------------- */
async function vistaLogin(msg = "") {
  let hayNegocio = true;
  try {
    hayNegocio = (await getDoc(doc(db, "config", "negocio"))).exists();
  } catch (e) {
    msg = msg || errAuth(e);
  }
  pantalla(`
    <div class="login">
      <div class="logo">E</div>
      <h1>${NEGOCIO}</h1>
      <p class="sub">Pedidos, entregas e inventario</p>
      <div id="msg" class="err">${esc(msg)}</div>
      <form id="f-login">
        <input id="l-mail" type="email" placeholder="Correo" autocomplete="username" required>
        <input id="l-pass" type="password" placeholder="Clave" autocomplete="current-password" required>
        <button class="btn">Ingresar</button>
      </form>
      ${hayNegocio ? "" : `
      <hr>
      <p class="sub">Primera vez: crea la cuenta del jefe</p>
      <form id="f-jefe">
        <input id="j-nom" placeholder="Tu nombre" required>
        <input id="j-mail" type="email" placeholder="Tu correo" required>
        <input id="j-pass" type="password" placeholder="Clave (mínimo 6)" minlength="6" required autocomplete="new-password">
        <button class="btn" style="background:var(--naranja)">Crear cuenta de jefe</button>
      </form>`}
    </div>`);

  $("#f-login").onsubmit = async e => {
    e.preventDefault();
    try {
      await signInWithEmailAndPassword(auth, $("#l-mail").value.trim(), $("#l-pass").value);
    } catch (er) {
      $("#msg").textContent = errAuth(er);
    }
  };

  if (!hayNegocio) {
    $("#f-jefe").onsubmit = async e => {
      e.preventDefault();
      const nombre = $("#j-nom").value.trim();
      const email = $("#j-mail").value.trim();
      S.registrando = true;
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, $("#j-pass").value);
        const b = writeBatch(db);
        b.set(doc(db, "config", "negocio"), { nombre: NEGOCIO, jefe: cred.user.uid, creado: Date.now() });
        b.set(doc(db, "users", cred.user.uid), { nombre, email, role: "jefe", active: true, creado: Date.now() });
        await b.commit();
        S.registrando = false;
        await entrar(cred.user);
      } catch (er) {
        S.registrando = false;
        $("#msg").textContent = errAuth(er);
      }
    };
  }
}

function vistaBloqueado(msg) {
  pantalla(`
    <div class="login">
      <div class="logo">E</div>
      <h1>${NEGOCIO}</h1>
      <p class="err">${esc(msg)}</p>
      <button id="salir2" class="btn">Salir</button>
    </div>`);
  $("#salir2").onclick = () => signOut(auth);
}

async function entrar(u) {
  try {
    const snap = await getDoc(doc(db, "users", u.uid));
    if (!snap.exists()) return vistaBloqueado("Tu cuenta no tiene acceso. Pídele al jefe que te cree el usuario.");
    if (snap.data().active === false) return vistaBloqueado("Tu cuenta está desactivada. Habla con el jefe.");
    S.perfil = { uid: u.uid, ...snap.data() };
    S.tab = "pedido";
    S.carrito = {};
    S.clientes = [];
    S.clienteSel = "";
    S.nota = "";
    S.fecha = hoy();
    S.busca = ""; S.cat = "Todas"; S.pbusca = ""; S.pcat = "Todas"; S.cbusca = "";
    if (S.unsub) S.unsub();
    S.unsub = onSnapshot(collection(db, "productos"), s => {
      S.productos = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
      refrescar();
    }, e => toast(errAuth(e)));
    vistaApp();
  } catch (e) {
    vistaBloqueado(errAuth(e));
  }
}

/* ---------------------------- ESTRUCTURA ---------------------------- */
function vistaApp() {
  const tabs = esJefe()
    ? [["pedido", "🛒", "Pedido"], ["entregas", "📦", "Entregas"], ["fiado", "💰", "Fiado"], ["clientes", "👤", "Clientes"], ["productos", "🏷️", "Productos"], ["cierre", "📊", "Cierre"], ["equipo", "👥", "Equipo"]]
    : [["pedido", "🛒", "Pedido"], ["entregas", "📦", "Mis pedidos"], ["productos", "🏷️", "Productos"], ["cierre", "📊", "Cierre"]];
  pantalla(`
    <header>
      <div><b>${NEGOCIO}</b><small>${esc(S.perfil.nombre)} · ${esJefe() ? "Jefe" : "Vendedor"}</small></div>
      <button id="salir" class="ghost">Salir</button>
    </header>
    <main id="main"></main>
    <nav id="nav">${tabs.map(([k, i, n]) => `<button data-tab="${k}"><span>${i}</span>${n}</button>`).join("")}</nav>`);
  $("#salir").onclick = () => signOut(auth);
  $("#nav").onclick = e => { const b = e.target.closest("button[data-tab]"); if (b) irTab(b.dataset.tab); };
  irTab(S.tab);
}

function irTab(t) {
  S.tab = t;
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  ({ pedido: tabPedido, entregas: tabEntregas, fiado: tabFiado, clientes: tabClientes, productos: tabProductos, cierre: tabCierre, equipo: tabEquipo })[t]();
}

function refrescar() {
  if (!S.perfil) return;
  if (S.tab === "pedido") { renderLista(); renderCarrito(); }
  if (S.tab === "productos") renderProductos();
}

/* ---------------------------- PEDIDO NUEVO ---------------------------- */
async function tabPedido() {
  $("#main").innerHTML = `
    <div class="card">
      <h3>Cliente</h3>
      <div class="row"><select id="cli" style="flex:1"></select><button id="cli-nuevo" class="ghost" style="white-space:nowrap">+ Nuevo</button></div>
      <div id="cli-info"></div>
    </div>
    <input id="busca" type="search" placeholder="Buscar producto…" value="${esc(S.busca)}">
    <div class="chips" id="chips">${["Todas", ...cats()].map(c => `<button class="chip ${S.cat === c ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div id="lista"></div>
    <div id="carrito"></div>`;
  $("#cli").onchange = e => { S.clienteSel = e.target.value; renderCliInfo(); };
  $("#cli-nuevo").onclick = () => formCliente();
  $("#busca").oninput = e => { S.busca = e.target.value; renderLista(); };
  $("#chips").onclick = e => { const c = e.target.dataset.c; if (!c) return; S.cat = c; tabPedido(); };
  renderLista();
  renderCarrito();
  renderCliSel();
  await cargarClientes();
  renderCliSel();
}

async function cargarClientes() {
  try {
    const q = esJefe() ? collection(db, "clientes") : query(collection(db, "clientes"), where("creadoPor", "==", S.perfil.uid));
    const s = await getDocs(q);
    S.clientes = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
  } catch (e) { toast(errAuth(e)); }
}

function renderCliSel() {
  const sel = $("#cli");
  if (!sel) return;
  sel.innerHTML = `<option value="">— Elige un cliente —</option>` + S.clientes.map(c => `<option value="${c.id}" ${c.id === S.clienteSel ? "selected" : ""}>${esc(c.nombre)}</option>`).join("");
  renderCliInfo();
}

function renderCliInfo() {
  const el = $("#cli-info");
  if (!el) return;
  const c = S.clientes.find(x => x.id === S.clienteSel);
  if (!c) { el.innerHTML = '<small style="color:var(--gris)">Elige un cliente o crea uno nuevo.</small>'; return; }
  el.innerHTML = `<small style="display:block;margin-top:6px;color:var(--gris)">${c.telefono ? "📞 " + esc(c.telefono) + "<br>" : ""}${c.direccion ? "📍 " + esc(c.direccion) + "<br>" : ""}${c.lat != null ? "✅ Ubicación guardada" : "Sin ubicación guardada"}</small>
    <button id="cli-edit" class="ghost" style="margin-top:6px">Editar / guardar ubicación</button>`;
  $("#cli-edit").onclick = () => formCliente(c.id);
}

function formCliente(id) {
  const c = id ? S.clientes.find(x => x.id === id) : { nombre: "", telefono: "", direccion: "", lat: null, lng: null };
  let lat = c.lat ?? null, lng = c.lng ?? null;
  const m = modal(`
    <h3>${id ? "Editar" : "Nuevo"} cliente</h3>
    <form id="fc">
      <input id="c-n" placeholder="Nombre del cliente o negocio" value="${esc(c.nombre)}" required>
      <input id="c-t" type="tel" inputmode="tel" placeholder="Teléfono / WhatsApp" value="${esc(c.telefono)}">
      <input id="c-d" placeholder="Dirección o referencia" value="${esc(c.direccion)}">
      <button type="button" id="c-gps" class="ghost" style="width:100%;margin:6px 0">📍 Usar mi ubicación actual</button>
      <div id="c-ub" style="font-size:14px;color:var(--gris);margin:4px 0 8px"></div>
      <button class="btn">Guardar cliente</button>
      ${id && esJefe() ? '<button type="button" id="c-del" class="danger">Eliminar cliente</button>' : ""}
      <button type="button" id="c-x" class="ghost" style="width:100%">Cancelar</button>
    </form>`);
  const ub = () => {
    m.querySelector("#c-ub").innerHTML = lat != null
      ? `✅ Ubicación guardada · <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" rel="noopener">ver en el mapa</a>`
      : "Sin ubicación guardada. Si estás donde el cliente, toca el botón de arriba.";
  };
  ub();
  m.querySelector("#c-x").onclick = () => m.remove();
  if (id && esJefe()) m.querySelector("#c-del").onclick = async () => {
    try {
      const s = await getDocs(query(collection(db, "pedidos"), where("clienteId", "==", id)));
      const datos = s.docs.map(d => d.data());
      const debe = datos.reduce((t, x) => t + (x.saldo || 0), 0);
      const pend = datos.filter(x => x.estado === "pendiente").length;
      let aviso = "¿Eliminar a " + c.nombre + "? Sus pedidos anteriores se conservan en el historial.";
      if (debe > 0) aviso += "\n\n⚠️ Este cliente debe " + money(debe) + " (fiado). Esa deuda seguirá apareciendo en la pestaña Fiado.";
      if (pend > 0) aviso += "\n\n⚠️ Tiene " + pend + " pedido(s) pendiente(s) de entrega.";
      if (!confirm(aviso)) return;
      await deleteDoc(doc(db, "clientes", id));
      if (S.clienteSel === id) S.clienteSel = "";
      m.remove();
      toast("Cliente eliminado");
      await cargarClientes();
      renderCliSel();
      renderClientes();
    } catch (er) { toast(errAuth(er)); }
  };
  m.querySelector("#c-gps").onclick = () => {
    if (!navigator.geolocation) return toast("Este celular no permite obtener la ubicación.");
    toast("Buscando ubicación…");
    navigator.geolocation.getCurrentPosition(pos => {
      lat = Math.round(pos.coords.latitude * 1e6) / 1e6;
      lng = Math.round(pos.coords.longitude * 1e6) / 1e6;
      ub();
      toast("Ubicación capturada (±" + Math.round(pos.coords.accuracy) + " m)");
    }, err => {
      toast(err.code === 1 ? "Permiso de ubicación denegado. Actívalo para este sitio en el navegador." : "No se pudo obtener la ubicación. Intenta de nuevo.");
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  };
  m.querySelector("#fc").onsubmit = async e => {
    e.preventDefault();
    const data = {
      nombre: m.querySelector("#c-n").value.trim(),
      telefono: m.querySelector("#c-t").value.trim(),
      direccion: m.querySelector("#c-d").value.trim(),
      lat, lng
    };
    try {
      if (id) {
        await updateDoc(doc(db, "clientes", id), data);
      } else {
        const ref = await addDoc(collection(db, "clientes"), { ...data, creadoPor: S.perfil.uid, creadoPorNombre: S.perfil.nombre, creado: Date.now() });
        S.clienteSel = ref.id;
      }
      m.remove();
      toast("Cliente guardado");
      await cargarClientes();
      renderCliSel();
      renderClientes();
    } catch (er) { toast(errAuth(er)); }
  };
}

function renderLista() {
  const el = $("#lista");
  if (!el) return;
  const q = S.busca.trim().toLowerCase();
  const l = S.productos.filter(p => (S.cat === "Todas" || p.categoria === S.cat) && p.nombre.toLowerCase().includes(q));
  el.innerHTML = l.length ? l.map(p => {
    const en = S.carrito[p.id] || 0;
    const sin = (p.stock || 0) <= 0;
    return `<div class="card prod ${sin ? "sin" : ""}" data-id="${p.id}">
      <div><b>${esc(p.nombre)}</b><small>${esc(p.categoria)} · Stock: ${p.stock || 0}</small></div>
      <div class="precio">${money(p.precio)}${en ? `<span class="badge">${en}</span>` : ""}</div>
    </div>`;
  }).join("") : `<p class="vacio">${S.productos.length ? "Sin resultados." : "Aún no hay productos. El jefe puede crearlos o importarlos en la pestaña Productos."}</p>`;
  el.onclick = e => { const c = e.target.closest(".prod"); if (c) agregar(c.dataset.id, 1); };
}

function agregar(id, n) {
  const p = S.productos.find(x => x.id === id);
  if (!p) return;
  const nuevo = (S.carrito[id] || 0) + n;
  if (nuevo <= 0) delete S.carrito[id];
  else {
    S.carrito[id] = nuevo;
    if (n > 0 && nuevo > (p.stock || 0)) toast("Ojo: solo hay " + (p.stock || 0) + " en stock de " + p.nombre);
  }
  renderLista();
  renderCarrito();
}

function renderCarrito() {
  const el = $("#carrito");
  if (!el) return;
  const ids = Object.keys(S.carrito).filter(id => S.productos.some(p => p.id === id));
  if (!ids.length) { el.innerHTML = ""; return; }
  let total = 0;
  const filas = ids.map(id => {
    const p = S.productos.find(x => x.id === id);
    const n = S.carrito[id];
    total += n * p.precio;
    return `<div class="fila"><span>${esc(p.nombre)}</span>
      <span class="qty"><button data-m="${id}">−</button><b>${n}</b><button data-p="${id}">+</button></span>
      <span>${money(n * p.precio)}</span></div>`;
  }).join("");
  el.innerHTML = `<div class="cart">
    <h3>Pedido actual</h3>${filas}
    <div class="total"><span>Total</span><b>${money(total)}</b></div>
    <input id="nota" placeholder="Observaciones (opcional)" value="${esc(S.nota)}">
    <button id="guardar" class="btn">Guardar pedido · ${money(total)}</button>
    <button id="vaciar" class="ghost">Vaciar</button>
  </div>`;
  $("#nota").oninput = e => { S.nota = e.target.value; };
  el.onclick = e => {
    const t = e.target;
    if (t.dataset.m) agregar(t.dataset.m, -1);
    else if (t.dataset.p) agregar(t.dataset.p, 1);
    else if (t.id === "vaciar") { S.carrito = {}; renderLista(); renderCarrito(); }
    else if (t.id === "guardar") guardarPedido();
  };
}

async function guardarPedido() {
  const cli = S.clientes.find(c => c.id === S.clienteSel);
  if (!cli) return toast("Elige o crea un cliente primero.");
  const items = [];
  let total = 0;
  for (const id of Object.keys(S.carrito)) {
    const p = S.productos.find(x => x.id === id);
    if (!p) continue;
    const n = S.carrito[id];
    items.push({ id, nombre: p.nombre, precio: p.precio, cantidad: n });
    total += n * p.precio;
  }
  if (!items.length) return;
  const btn = $("#guardar");
  btn.disabled = true;
  try {
    const data = {
      uid: S.perfil.uid, vendedor: S.perfil.nombre,
      clienteId: cli.id, cliente: cli.nombre, telefono: cli.telefono || "", direccion: cli.direccion || "",
      lat: cli.lat ?? null, lng: cli.lng ?? null,
      items, total, nota: S.nota.trim(),
      estado: "pendiente", pagado: 0, saldo: 0, pagos: [],
      dia: hoy(), ts: Date.now()
    };
    const ref = await addDoc(collection(db, "pedidos"), data);
    S.carrito = {};
    S.nota = "";
    renderLista();
    renderCarrito();
    toast("Pedido guardado");
    factura({ id: ref.id, ...data });
  } catch (e) {
    toast(errAuth(e));
    btn.disabled = false;
  }
}

/* ---------------------------- FACTURA ---------------------------- */
const textoEstado = p => p.estado === "pendiente" ? "Pendiente de entrega" : p.estado === "cancelado" ? "Cancelado" : p.saldo > 0 ? "Entregado · saldo pendiente" : "Entregado · pagado";
const colorEstado = p => p.estado === "cancelado" ? "#c62828" : (p.estado === "pendiente" || p.saldo > 0) ? "#ef6c00" : "#2e7d32";

function descargarBlob(blob, nombre) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* Dibuja la factura como imagen (PNG), de la altura que necesite el pedido */
function facturaCanvas(p) {
  const W = 800, PAD = 40;
  const VERDE = "#2e7d32", MORADO = "#6a1b9a", NARANJA = "#ef6c00", GRIS = "#6b7280", TEXTO = "#1f2937", BORDE = "#e5e7eb";
  const F = (px, w = 400) => `${w} ${px}px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif`;
  const unidades = p.items.reduce((t, i) => t + i.cantidad, 0);

  const cortar = (ctx, t, maxW, font) => {
    ctx.font = font;
    let s = String(t);
    if (ctx.measureText(s).width <= maxW) return s;
    while (s.length > 1 && ctx.measureText(s + "…").width > maxW) s = s.slice(0, -1);
    return s + "…";
  };
  const envolver = (ctx, txt, maxW, maxLin, font) => {
    ctx.font = font;
    const lineas = [];
    let cur = "";
    for (const w of String(txt).split(/\s+/)) {
      const t = cur ? cur + " " + w : w;
      if (!cur || ctx.measureText(t).width <= maxW) cur = t;
      else { lineas.push(cur); cur = w; }
    }
    if (cur) lineas.push(cur);
    if (lineas.length > maxLin) { lineas.length = maxLin; lineas[maxLin - 1] += "…"; }
    return lineas.map(l => cortar(ctx, l, maxW, font));
  };
  const rr = (ctx, x, y, w, h, r) => {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };
  const T = (ctx, txt, x, y, font, color, align = "left") => {
    ctx.font = font;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = "top";
    ctx.fillText(txt, x, y);
  };

  const dibujar = ctx => {
    /* Encabezado */
    const g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, VERDE);
    g.addColorStop(1, MORADO);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, 120);
    ctx.fillStyle = NARANJA;
    ctx.fillRect(0, 120, W, 6);
    ctx.fillStyle = "rgba(255,255,255,0.2)";
    rr(ctx, PAD, 26, 68, 68, 18);
    ctx.fill();
    T(ctx, "E", PAD + 34, 40, F(40, 800), "#fff", "center");
    T(ctx, NEGOCIO, PAD + 88, 28, F(34, 800), "#fff");
    T(ctx, "Factura de pedido", PAD + 88, 72, F(16), "rgba(255,255,255,0.88)");
    T(ctx, "Pedido #" + cod(p), W - PAD, 30, F(22, 700), "#fff", "right");
    T(ctx, fh(p.ts), W - PAD, 64, F(15), "rgba(255,255,255,0.88)", "right");

    /* Cliente y estado */
    let y = 156;
    T(ctx, "CLIENTE", PAD, y, F(12, 700), GRIS);
    let yl = y + 18;
    envolver(ctx, p.cliente, 440, 2, F(22, 800)).forEach(l => { T(ctx, l, PAD, yl, F(22, 800), TEXTO); yl += 28; });
    yl += 4;
    if (p.telefono) { T(ctx, "Tel: " + p.telefono, PAD, yl, F(15), TEXTO); yl += 22; }
    if (p.direccion) envolver(ctx, p.direccion, 440, 2, F(15)).forEach(l => { T(ctx, l, PAD, yl, F(15), TEXTO); yl += 21; });
    T(ctx, "ESTADO", W - PAD, y, F(12, 700), GRIS, "right");
    let yr = y + 18;
    envolver(ctx, textoEstado(p), 250, 2, F(16, 700)).forEach(l => { T(ctx, l, W - PAD, yr, F(16, 700), colorEstado(p), "right"); yr += 22; });
    y = Math.max(yl, yr) + 18;

    /* Tabla de productos */
    ctx.fillStyle = "#f3e5f5";
    rr(ctx, PAD, y, W - 2 * PAD, 34, 8);
    ctx.fill();
    T(ctx, "CANT.", PAD + 14, y + 11, F(12, 700), MORADO);
    T(ctx, "PRODUCTO", 118, y + 11, F(12, 700), MORADO);
    T(ctx, "V. UNIT.", 596, y + 11, F(12, 700), MORADO, "right");
    T(ctx, "SUBTOTAL", W - PAD - 14, y + 11, F(12, 700), MORADO, "right");
    y += 34;
    p.items.forEach((i, k) => {
      const lin = envolver(ctx, i.nombre, 380, 2, F(16));
      const h = lin.length * 21 + 18;
      if (k % 2) { ctx.fillStyle = "#faf7fb"; ctx.fillRect(PAD, y, W - 2 * PAD, h); }
      T(ctx, String(i.cantidad), PAD + 14, y + 9, F(16, 700), TEXTO);
      lin.forEach((l, n) => T(ctx, l, 118, y + 9 + n * 21, F(16), TEXTO));
      T(ctx, money(i.precio), 596, y + 9, F(15), GRIS, "right");
      T(ctx, money(i.cantidad * i.precio), W - PAD - 14, y + 9, F(16, 700), TEXTO, "right");
      ctx.fillStyle = BORDE;
      ctx.fillRect(PAD, y + h - 1, W - 2 * PAD, 1);
      y += h;
    });

    /* Totales */
    y += 22;
    T(ctx, `${p.items.length} producto(s) · ${unidades} unidad(es)`, PAD, y + 24, F(15), GRIS);
    const bx = W - PAD - 320;
    ctx.fillStyle = "#fff3e0";
    rr(ctx, bx, y, 320, 66, 14);
    ctx.fill();
    T(ctx, "TOTAL", bx + 18, y + 14, F(13, 700), NARANJA);
    T(ctx, money(p.total), bx + 302, y + 16, F(32, 800), NARANJA, "right");
    y += 66;
    if (p.estado === "entregado") {
      y += 14;
      T(ctx, "Pagado", bx + 18, y, F(15), GRIS);
      T(ctx, money(p.pagado), bx + 302, y, F(15, 700), VERDE, "right");
      y += 24;
      T(ctx, "Saldo pendiente", bx + 18, y, F(15), GRIS);
      T(ctx, money(p.saldo), bx + 302, y, F(15, 700), p.saldo > 0 ? NARANJA : VERDE, "right");
      y += 22;
    }
    if (p.nota) {
      y += 22;
      T(ctx, "OBSERVACIONES", PAD, y, F(12, 700), GRIS);
      y += 18;
      envolver(ctx, p.nota, W - 2 * PAD, 3, F(15)).forEach(l => { T(ctx, l, PAD, y, F(15), TEXTO); y += 21; });
    }

    /* Pie */
    y += 26;
    ctx.fillStyle = BORDE;
    ctx.fillRect(PAD, y, W - 2 * PAD, 1);
    T(ctx, "¡Gracias por tu compra!", W / 2, y + 20, F(20, 800), MORADO, "center");
    T(ctx, `Atendió: ${p.vendedor} · ${NEGOCIO}`, W / 2, y + 52, F(13), GRIS, "center");
    y += 86;
    ctx.fillStyle = g;
    ctx.fillRect(0, y, W, 8);
    return y + 8;
  };

  const tmp = document.createElement("canvas");
  tmp.width = W;
  tmp.height = 10;
  const H = dibujar(tmp.getContext("2d"));
  const SC = Math.min(2, 15000 / H);
  const c = document.createElement("canvas");
  c.width = Math.round(W * SC);
  c.height = Math.ceil(H * SC);
  const ctx = c.getContext("2d");
  ctx.scale(SC, SC);
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, W, H);
  dibujar(ctx);
  return c;
}

async function facturaBlob(p) {
  const c = facturaCanvas(p);
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  if (!blob) throw new Error("no se pudo crear la imagen");
  return blob;
}

async function compartirFactura(p) {
  try {
    const blob = await facturaBlob(p);
    const nombre = `Factura-Emunah-${cod(p)}.png`;
    const file = new File([blob], nombre, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: `Factura ${NEGOCIO}`, text: `Factura ${NEGOCIO} · ${p.cliente} · ${money(p.total)}` });
        return;
      } catch (e) { if (e && e.name === "AbortError") return; }
    }
    descargarBlob(blob, nombre);
    toast("La imagen se guardó en tu celular. Adjúntala en WhatsApp.");
  } catch (e) { toast("No se pudo crear la factura: " + e.message); }
}

    </div>`);
  w.querySelector("#f-x").onclick = () => w.remove();
  w.querySelector("#f-pr").onclick = () => window.print();
  w.querySelector("#f-sh").onclick = () => compartirFactura(p);
  w.querySelector("#f-dl").onclick = async () => {
    try {
      descargarBlob(await facturaBlob(p), `Factura-Emunah-${cod(p)}.png`);
      toast("Imagen guardada en tu celular");
    } catch (e) { toast("No se pudo crear la imagen: " + e.message); }
  };
  if (p.telefono) w.querySelector("#f-wa").onclick = () => {

    const num = tel.length === 10 ? "57" + tel : tel;
    window.open(`https://wa.me/${num}?text=${encodeURIComponent(txt)}`, "_blank");
  };
}

    <small>${p.items.map(i => `${i.cantidad}× ${esc(i.nombre)}`).join(", ")}</small>
    ${p.direccion ? `<small>📍 ${esc(p.direccion)}</small>` : ""}
    ${p.nota ? `<small>📝 ${esc(p.nota)}</small>` : ""}
    <div class="row" style="flex-wrap:wrap;margin-top:8px">

async function cargarEntregas() {
  const el = $("#entlista");
  if (!el) return;
  try {
    const cs = [where("estado", "==", "pendiente")];
    if (!esJefe()) cs.push(where("uid", "==", S.perfil.uid));
    const s = await getDocs(query(collection(db, "pedidos"), ...cs));
    S.pend = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.ts - b.ts);
    el.innerHTML = S.pend.length ? S.pend.map(tarjetaPedido).join("") : '<p class="vacio">No hay pedidos pendientes.</p>';
    el.onclick = e => {
      const b = e.target.closest("button[data-ped]");
      if (!b) return;
      const p = S.pend.find(x => x.id === b.dataset.ped);
      if (!p) return;
      if (b.dataset.act === "ver") factura(p);
      else if (b.dataset.act === "entregar") modalEntrega(p);
      else if (b.dataset.act === "cancelar") cancelarPedido(p);
    };
  } catch (e) {
    el.innerHTML = `<p class="vacio">${esc(errAuth(e))}</p>`;
  }
}

function modalConsolidado() {
  const lista = S.pend;
  if (!lista.length) return toast("No hay pedidos pendientes para consolidar.");
  const acc = {};
  lista.forEach(p => p.items.forEach(i => {
    const a = acc[i.id] = acc[i.id] || { id: i.id, nombre: i.nombre, cantidad: 0, valor: 0 };
    a.cantidad += i.cantidad;
    a.valor += i.cantidad * i.precio;
  }));
  const filas = Object.values(acc).sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
  const unidades = filas.reduce((t, x) => t + x.cantidad, 0);
  const valor = sum(lista);
  const nClientes = new Set(lista.map(p => p.clienteId || p.cliente)).size;
  const falta = f => { const pr = S.productos.find(x => x.id === f.id); return pr ? Math.max(0, f.cantidad - (pr.stock || 0)) : 0; };
  const m = modal(`
    <div class="factura">
      <h3 style="text-align:center;margin:0">Consolidado de entregas</h3>
      <small style="display:block;text-align:center;color:var(--gris)">${NEGOCIO} · ${fh(Date.now())}</small>
      <div class="kpis">${kpi("Pedidos", lista.length)}${kpi("Clientes", nClientes)}${kpi("Unidades", unidades)}${kpi("Valor total", money(valor))}</div>
      <h3>Productos a llevar</h3>
      ${filas.map(f => `<div class="lin"><span><b>${f.cantidad}×</b> ${esc(f.nombre)}${falta(f) ? `<span class="pill off">Faltan ${falta(f)}</span>` : ""}</span><span>${money(f.valor)}</span></div>`).join("")}
      <h3 style="margin-top:14px">Pedidos incluidos</h3>
      ${lista.map(p => `<div class="lin"><span>${esc(p.cliente)}${p.direccion ? `<small style="display:block;color:var(--gris)">📍 ${esc(p.direccion)}</small>` : ""}</span><span>${money(p.total)}</span></div>`).join("")}
    </div>
    <div class="noprint" style="margin-top:12px">
      <button id="co-wa" class="btn">Compartir por WhatsApp</button>
      <button id="co-pr" class="ghost" style="width:100%;margin-bottom:6px">Imprimir / guardar PDF</button>
      <button id="co-x" class="ghost" style="width:100%">Cerrar</button>
    </div>`);
  m.querySelector("#co-x").onclick = () => m.remove();
  m.querySelector("#co-pr").onclick = () => window.print();
  m.querySelector("#co-wa").onclick = () => {
    const txt = `*${NEGOCIO}* — Consolidado de entregas\n${fh(Date.now())}\n${lista.length} pedidos · ${nClientes} clientes\n\n*Productos a llevar*\n${filas.map(f => `• ${f.cantidad}× ${f.nombre}`).join("\n")}\n\n*Total: ${unidades} unidades · ${money(valor)}*`;

async function cancelarPedido(p) {
  if (!confirm("¿Cancelar el pedido de " + p.cliente + "? No se descuenta stock.")) return;
  try {
    await updateDoc(doc(db, "pedidos", p.id), { estado: "cancelado", saldo: 0, canceladoTs: Date.now() });

}

function modalEntrega(p) {
  const m = modal(`
    <h3>Entregar a ${esc(p.cliente)}</h3>
    <div class="total"><span>Total del pedido</span><b>${money(p.total)}</b></div>
    <select id="en-tipo">
      <option value="completo">Pagó completo</option>
      <option value="parcial">Pagó una parte (el resto queda fiado)</option>
      <option value="fiado">Fiado (no pagó nada)</option>
    </select>
    <input id="en-monto" type="number" inputmode="numeric" min="1" max="${p.total}" placeholder="¿Cuánto pagó?" style="display:none">
    <select id="en-metodo">${METODOS.map(x => `<option>${x}</option>`).join("")}</select>
    <button id="en-ok" class="btn">Confirmar entrega</button>
    <button id="en-x" class="ghost" style="width:100%">Cancelar</button>`);
  const tipo = m.querySelector("#en-tipo"), monto = m.querySelector("#en-monto"), metodo = m.querySelector("#en-metodo");
  tipo.onchange = () => {
    monto.style.display = tipo.value === "parcial" ? "block" : "none";
    metodo.style.display = tipo.value === "fiado" ? "none" : "block";
  };
  m.querySelector("#en-x").onclick = () => m.remove();
  m.querySelector("#en-ok").onclick = async () => {
    const pago = tipo.value === "completo" ? p.total : tipo.value === "fiado" ? 0 : Math.round(Number(monto.value) || 0);
    if (tipo.value === "parcial" && (pago <= 0 || pago >= p.total)) return toast("El pago parcial debe ser mayor que 0 y menor que el total.");
    const faltan = p.items.filter(i => { const pr = S.productos.find(x => x.id === i.id); return !pr || (pr.stock || 0) < i.cantidad; }).map(i => i.nombre);
    if (faltan.length && !confirm("Stock insuficiente de: " + faltan.join(", ") + ". ¿Entregar igual?")) return;
    const btn = m.querySelector("#en-ok");
    btn.disabled = true;
    try {
      const b = writeBatch(db);
      const ts = Date.now();
      const met = metodo.value;
      b.update(doc(db, "pedidos", p.id), {
        estado: "entregado", pagado: pago, pagoEntrega: pago, saldo: p.total - pago,
        pagos: pago > 0 ? [{ monto: pago, metodo: met, ts }] : [],
        entregadoTs: ts, diaEntrega: hoy()
      });
      p.items.forEach(i => { if (S.productos.some(x => x.id === i.id)) b.update(doc(db, "productos", i.id), { stock: increment(-i.cantidad) }); });
      if (pago > 0) b.set(doc(collection(db, "pagos")), { pedidoId: p.id, clienteId: p.clienteId, cliente: p.cliente, monto: pago, metodo: met, dia: hoy(), ts });
      await b.commit();
      m.remove();
      toast("Entrega registrada");
      cargarEntregas();
    } catch (e) {
      toast(errAuth(e));
      btn.disabled = false;
    }
  };
}

async function cargarFiado() {
  const el = $("#flista");
  if (!el) return;
  try {
    const s = await getDocs(query(collection(db, "pedidos"), where("saldo", ">", 0)));
    const g = {};
    s.docs.forEach(d => {
      const p = { id: d.id, ...d.data() };
      const k = p.clienteId || p.cliente;
      g[k] = g[k] || { id: p.clienteId, cliente: p.cliente, telefono: p.telefono, saldo: 0, pedidos: [] };
      g[k].saldo += p.saldo;
      g[k].pedidos.push(p);
    });
    const lista = Object.values(g).sort((a, b) => b.saldo - a.saldo);
    const totalDeuda = lista.reduce((t, x) => t + x.saldo, 0);
    el.innerHTML = lista.length ? `
      <div class="kpis"><div class="kpi grande"><small>Total por cobrar</small><b>${money(totalDeuda)}</b></div></div>
      ${lista.map((x, i) => `<div class="card">
        <div class="lin" style="border:0;padding:0"><b>${esc(x.cliente)}</b><b style="color:var(--naranja)">${money(x.saldo)}</b></div>
        ${x.pedidos.sort((a, b) => a.ts - b.ts).map(p => `<div class="lin"><span>#${cod(p)} · ${fh(p.ts)}</span><span>${money(p.saldo)}</span></div>`).join("")}
        <div class="row" style="margin-top:8px">
          <button class="btn chico" data-i="${i}">Registrar abono</button>
          ${x.telefono ? `<a class="ghost" href="tel:${esc(x.telefono)}">Llamar</a>` : ""}
        </div>
      </div>`).join("")}` : '<p class="vacio">Nadie debe nada. 🎉</p>';
    el.onclick = e => {
      const b = e.target.closest("button[data-i]");
      if (b) abonar(lista[Number(b.dataset.i)]);
    };
  } catch (e) {
    el.innerHTML = `<p class="vacio">${esc(errAuth(e))}</p>`;
  }
}

function abonar(g) {
  const m = modal(`
    <h3>Abono de ${esc(g.cliente)}</h3>
    <div class="total"><span>Debe</span><b>${money(g.saldo)}</b></div>
    <input id="ab-monto" type="number" inputmode="numeric" min="1" max="${g.saldo}" placeholder="¿Cuánto abona?">
    <select id="ab-metodo">${METODOS.map(x => `<option>${x}</option>`).join("")}</select>
    <button id="ab-ok" class="btn">Registrar abono</button>
    <button id="ab-x" class="ghost" style="width:100%">Cancelar</button>`);
  m.querySelector("#ab-x").onclick = () => m.remove();
  m.querySelector("#ab-ok").onclick = async () => {
    let resto = Math.round(Number(m.querySelector("#ab-monto").value) || 0);
    if (resto <= 0 || resto > g.saldo) return toast("Monto no válido (máximo " + money(g.saldo) + ").");
    const met = m.querySelector("#ab-metodo").value;
    const btn = m.querySelector("#ab-ok");
    btn.disabled = true;
    try {
      const b = writeBatch(db);
      const ts = Date.now(), dia = hoy();
      for (const p of g.pedidos.slice().sort((a, b2) => a.ts - b2.ts)) {
        if (resto <= 0) break;
        const ap = Math.min(p.saldo, resto);
        resto -= ap;
        b.update(doc(db, "pedidos", p.id), { pagado: increment(ap), saldo: increment(-ap), pagos: arrayUnion({ monto: ap, metodo: met, ts }) });
        b.set(doc(collection(db, "pagos")), { pedidoId: p.id, clienteId: g.id || "", cliente: g.cliente, monto: ap, metodo: met, dia, ts });
      }
      await b.commit();
      m.remove();
      toast("Abono registrado");
      cargarFiado();
    } catch (e) {
      toast(errAuth(e));
      btn.disabled = false;
    }
  };
}

/*PARSER_CLI_START*/
function parsearClientes(txt) {
  const filas = [];
  let malas = 0;
  String(txt || "").split(/\r?\n/).forEach(l => {
    if (!l.trim()) return;
    const c = l.split(/\t|;|\|/).map(x => x.trim());
    if (!c[0]) { malas++; return; }
    filas.push({ nombre: c[0], telefono: c[1] || "", direccion: c[2] || "" });
  });
  return { filas, malas };
}
/*PARSER_CLI_END*/

      m.remove();
      toast(`Importados ${nuevas.length}${repetidos ? ` · ${repetidos} repetidos omitidos` : ""}${malas ? ` · ${malas} con error` : ""}`);
      await cargarClientes();
      renderClientes();
      renderCliSel();
    } catch (e) {
      toast(errAuth(e));
      btn.disabled = false;
    }
  };

/*PARSER_START*/
function limpioNum(s) {
  s = String(s || "").trim().replace(/^\$/, "");
  s = s.replace(/[.,]\d{1,2}$/, "");
  return Math.round(Number(s.replace(/\D/g, "")));
}
function parsearLista(txt) {
  const filas = [];
  let malas = 0;
  String(txt || "").split(/\r?\n/).forEach(l => {
    if (!l.trim()) return;
    const c = l.split(/\t|;|\|/).map(x => x.trim());
    const nombre = c[0];
    const precio = limpioNum(c[2]);
    const stock = limpioNum(c[3]) || 0;
    if (!nombre || !(precio > 0)) { malas++; return; }
    filas.push({ nombre, categoria: c[1] || "Otros", precio, stock });
  });
  return { filas, malas };
}
/*PARSER_END*/

  m.querySelector("#im-ok").onclick = async () => {
    const { filas, malas } = parsearLista(t.value);
    const existentes = new Set(S.productos.map(p => p.nombre.trim().toLowerCase()));
    const vistos = new Set();
    const nuevas = filas.filter(f => {
      const k = f.nombre.toLowerCase();
      if (existentes.has(k) || vistos.has(k)) return false;
      vistos.add(k);
      return true;
    });
    const repetidos = filas.length - nuevas.length;
    if (!nuevas.length) return toast("No hay productos nuevos para importar.");
    const btn = m.querySelector("#im-ok");
    btn.disabled = true;
    try {
      for (let i = 0; i < nuevas.length; i += 400) {
        const b = writeBatch(db);
        nuevas.slice(i, i + 400).forEach(f => b.set(doc(collection(db, "productos")), f));
        await b.commit();
      }
      m.remove();
      toast(`Importados ${nuevas.length}${repetidos ? ` · ${repetidos} repetidos omitidos` : ""}${malas ? ` · ${malas} con error` : ""}`);
    } catch (e) {
      toast(errAuth(e));
      btn.disabled = false;
    }
  };
}

/* ---------------------------- CIERRE DEL DÍA ---------------------------- */
function tabCierre() {
  $("#main").innerHTML = `
    <div class="row"><input type="date" id="fecha" value="${S.fecha}"><button id="act" class="ghost">Actualizar</button></div>
    <div id="cierre"><p class="vacio">Cargando…</p></div>`;
  $("#fecha").onchange = e => { S.fecha = e.target.value || hoy(); cargarCierre(); };
  $("#act").onclick = cargarCierre;
  cargarCierre();
}

const kpi = (t, v, grande) => `<div class="kpi ${grande ? "grande" : ""}"><small>${t}</small><b>${v}</b></div>`;
const filaPedido = (p, conVend) => `<div class="card venta" data-ped="${p.id}" style="cursor:pointer">
  <div class="lin" style="border:0;padding:0"><b>${esc(p.cliente)}${pillEstado(p)}</b><b style="color:var(--verde)">${money(p.total)}</b></div>
  <small>#${cod(p)} · ${hora(p.ts)}${conVend ? " · " + esc(p.vendedor) : ""}</small>
  <small>${p.items.map(i => `${i.cantidad}× ${esc(i.nombre)}`).join(", ")}</small>
</div>`;
const bloquePares = (titulo, pares) => pares.length ? `<div class="card"><h3>${titulo}</h3>${pares.map(([n, t]) => `<div class="lin"><span>${esc(n)}</span><b>${money(t)}</b></div>`).join("")}</div>` : "";
const agrupar = (arr, clave, valor) => {
  const m = {};
  arr.forEach(x => { m[x[clave]] = (m[x[clave]] || 0) + valor(x); });
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
};

async function cargarCierre() {
  const el = $("#cierre");
  if (!el) return;
  const f = S.fecha;
  const lee = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
  try {
    if (!esJefe()) {
      const s = await getDocs(query(collection(db, "pedidos"), where("dia", "==", f), where("uid", "==", S.perfil.uid)));
      const v = lee(s).sort((a, b) => b.ts - a.ts);
      const act = v.filter(x => x.estado !== "cancelado");
      S.docsCierre = v;
      el.innerHTML = `<div class="kpis">
        ${kpi("Pedidos tomados", act.length, true)}
        ${kpi("Valor de los pedidos", money(sum(act)))}
        ${kpi("Ya entregados", act.filter(x => x.estado === "entregado").length)}
      </div>
      <h3>Mis pedidos del día</h3>
      ${v.length ? v.map(p => filaPedido(p, false)).join("") : '<p class="vacio">No tomaste pedidos en esta fecha.</p>'}`;
    } else {
      const [cr, en, pg, de] = await Promise.all([
        getDocs(query(collection(db, "pedidos"), where("dia", "==", f))),
        getDocs(query(collection(db, "pedidos"), where("diaEntrega", "==", f))),
        getDocs(query(collection(db, "pagos"), where("dia", "==", f))),
        getDocs(query(collection(db, "pedidos"), where("saldo", ">", 0)))
      ]);
      const creados = lee(cr).filter(x => x.estado !== "cancelado").sort((a, b) => b.ts - a.ts);
      const entregas = lee(en).sort((a, b) => b.entregadoTs - a.entregadoTs);
      const pagos = lee(pg);
      const deudas = lee(de);
      const cobrado = pagos.reduce((t, x) => t + x.monto, 0);
      const fiadoHoy = entregas.reduce((t, x) => t + (x.total - (x.pagoEntrega || 0)), 0);
      S.docsCierre = [...creados, ...entregas];
      el.innerHTML = `<div class="kpis">
        ${kpi("Dinero cobrado", money(cobrado), true)}
        ${kpi("Entregado (valor)", money(sum(entregas)))}
        ${kpi("Entregas hechas", entregas.length)}
        ${kpi("Fiado de este día", money(fiadoHoy))}
        ${kpi("Fiado total por cobrar", money(deudas.reduce((t, x) => t + x.saldo, 0)))}
      </div>
      ${bloquePares("Cobrado por método", agrupar(pagos, "metodo", x => x.monto))}
      ${bloquePares("Pedidos tomados por vendedor", agrupar(creados, "vendedor", x => x.total))}
      <h3>Entregas del día</h3>
      ${entregas.length ? entregas.map(p => filaPedido(p, true)).join("") : '<p class="vacio">No hubo entregas.</p>'}
      <h3>Pedidos tomados ese día</h3>
      ${creados.length ? creados.map(p => filaPedido(p, true)).join("") : '<p class="vacio">No se tomaron pedidos.</p>'}`;
    }
    el.onclick = e => {
      const c = e.target.closest("[data-ped]");
      if (!c) return;
      const p = S.docsCierre.find(x => x.id === c.dataset.ped);
      if (p) factura(p);
    };
  } catch (e) {
    el.innerHTML = `<p class="vacio">${esc(errAuth(e))}</p>`;
  }
}

/* ---------------------------- EQUIPO + RESPALDO (solo jefe) ---------------------------- */
function descargarCSV(nombre, filas) {
  const csv = filas.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${nombre}-${hoy()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

async function respaldo(tipo) {
  try {
    if (tipo === "productos") {
      descargarCSV("productos", [["Nombre", "Categoría", "Precio", "Stock"], ...S.productos.map(p => [p.nombre, p.categoria, p.precio, p.stock])]);
    } else if (tipo === "clientes") {
      const s = await getDocs(collection(db, "clientes"));
      descargarCSV("clientes", [["Nombre", "Teléfono", "Dirección", "Latitud", "Longitud", "Creado por"], ...s.docs.map(d => { const c = d.data(); return [c.nombre, c.telefono, c.direccion, c.lat, c.lng, c.creadoPorNombre]; })]);
    } else {
      const s = await getDocs(collection(db, "pedidos"));
      const v = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.ts - b.ts);
      descargarCSV("pedidos", [["Fecha", "Pedido", "Cliente", "Vendedor", "Estado", "Total", "Pagado", "Saldo", "Productos"], ...v.map(p => [fh(p.ts), cod(p), p.cliente, p.vendedor, p.estado, p.total, p.pagado, p.saldo, p.items.map(i => `${i.cantidad}x ${i.nombre}`).join(" | ")])]);
    }
    toast("Copia descargada");
  } catch (e) { toast(errAuth(e)); }
}

function tabEquipo() {
  $("#main").innerHTML = `
    <div class="card"><h3>Nuevo vendedor</h3>
      <form id="fe">
        <input id="e-n" placeholder="Nombre" required>
        <input id="e-m" type="email" placeholder="Correo" required>
        <input id="e-p" type="text" placeholder="Clave inicial (mínimo 6)" minlength="6" required autocomplete="off">
        <button class="btn">Crear vendedor</button>
      </form>
    </div>
    <h3>Equipo</h3>
    <div id="eqlista"><p class="vacio">Cargando…</p></div>
    <div class="card"><h3>Copia de seguridad</h3>
      <small style="color:var(--gris)">Descarga tus datos en archivos que abre Excel. Hazlo cada semana.</small>
      <div class="row" style="flex-wrap:wrap;margin-top:8px">
        <button class="ghost" data-r="productos">Productos</button>
        <button class="ghost" data-r="clientes">Clientes</button>
        <button class="ghost" data-r="pedidos">Pedidos</button>
      </div>
    </div>`;
  document.querySelectorAll("[data-r]").forEach(b => { b.onclick = () => respaldo(b.dataset.r); });
  $("#fe").onsubmit = async e => {
    e.preventDefault();
    const nombre = $("#e-n").value.trim();
    const email = $("#e-m").value.trim();
    const pass = $("#e-p").value;
    const btn = e.target.querySelector("button");
    btn.disabled = true;
    try {
      const sec = getApps().find(a => a.name === "sec") || initializeApp(firebaseConfig, "sec");
      const secAuth = getAuth(sec);
      let cred;
      try {
        cred = await createUserWithEmailAndPassword(secAuth, email, pass);
      } catch (er0) {
        if (!((er0.code || "").includes("email-already-in-use"))) throw er0;
        try { cred = await signInWithEmailAndPassword(secAuth, email, pass); }
        catch (er1) { throw { code: "ya-existe" }; }
        if ((await getDoc(doc(db, "users", cred.user.uid))).exists()) { await signOut(secAuth); throw { code: "ya-en-equipo" }; }
      }
      await setDoc(doc(db, "users", cred.user.uid), { nombre, email, role: "vendedor", active: true, creado: Date.now() });
      await signOut(secAuth);
      e.target.reset();
      toast("Vendedor creado. Pásale su correo y clave.");
      cargarEquipo();
    } catch (er) {
      toast(errAuth(er));
    }
    btn.disabled = false;
  };
  cargarEquipo();
}

async function cargarEquipo() {
  const el = $("#eqlista");
  if (!el) return;
  try {
    const s = await getDocs(collection(db, "users"));
    const u = s.docs.map(d => ({ uid: d.id, ...d.data() })).sort((a, b) => (a.role === "jefe" ? -1 : 1) - (b.role === "jefe" ? -1 : 1) || a.nombre.localeCompare(b.nombre, "es"));
    el.innerHTML = u.map(x => `
      <div class="card">
        <div class="lin" style="border:0;padding:0"><b>${esc(x.nombre)}<span class="pill ${x.active === false ? "off" : ""}">${x.role === "jefe" ? "Jefe" : x.active === false ? "Desactivado" : "Vendedor"}</span></b></div>
        <small style="color:var(--gris)">${esc(x.email)}</small>
        ${x.uid !== S.perfil.uid ? `<div class="row" style="margin-top:8px">
          <button class="ghost" data-act="toggle" data-uid="${x.uid}" data-on="${x.active === false ? 1 : 0}">${x.active === false ? "Activar" : "Desactivar"}</button>
          <button class="ghost" data-act="reset" data-mail="${esc(x.email)}">Restablecer clave</button>
          <button class="ghost" style="color:#c62828" data-act="del" data-uid="${x.uid}" data-nombre="${esc(x.nombre)}">Eliminar</button>
        </div>` : ""}
      </div>`).join("");
    el.onclick = async e => {
      const b = e.target.closest("button[data-act]");
      if (!b) return;
      try {
        if (b.dataset.act === "del") {
          if (!confirm("¿Eliminar a " + b.dataset.nombre + " del equipo? Ya no podrá entrar a la app. Sus pedidos anteriores se conservan en el historial.")) return;
          await deleteDoc(doc(db, "users", b.dataset.uid));
          toast("Vendedor eliminado");
          cargarEquipo();
        } else if (b.dataset.act === "toggle") {
          await updateDoc(doc(db, "users", b.dataset.uid), { active: b.dataset.on === "1" });
          cargarEquipo();
        } else {
          await sendPasswordResetEmail(auth, b.dataset.mail);
          toast("Se envió un correo para cambiar la clave.");
        }
      } catch (er) { toast(errAuth(er)); }
    };
  } catch (e) {
    el.innerHTML = `<p class="vacio">${esc(errAuth(e))}</p>`;
  }
}

/* ---------------------------- INICIO ---------------------------- */
if (firebaseConfig.apiKey.startsWith("PEGA")) {
  pantalla(`<div class="login"><div class="logo">E</div><h1>Falta configurar</h1><p class="sub">Pega las claves de Firebase dentro del archivo (busca el texto PEGA_AQUI).</p></div>`);
} else {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  onAuthStateChanged(auth, async u => {
    if (S.registrando) return;
    if (S.unsub) { S.unsub(); S.unsub = null; }
    if (!u) { S.perfil = null; return vistaLogin(); }
    await entrar(u);
  });
}
