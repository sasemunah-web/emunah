@page{margin:10mm}
.menubtn{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:10px;font-size:22px;width:44px;height:40px}
.cartbar{position:fixed;left:8px;right:8px;bottom:calc(62px + env(safe-area-inset-bottom));z-index:6;max-width:624px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:2px solid var(--naranja);border-radius:14px;padding:8px 8px 8px 14px;box-shadow:0 6px 18px rgba(0,0,0,.2)}

.cartlist{max-height:46vh;overflow:auto;margin:6px 0}
.buscador{position:relative;margin:6px 0}.buscador span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}.buscador input{padding-left:38px;margin:0}
.fcliente{display:flex;justify-content:space-between;gap:12px;background:var(--fondo);border:1px solid var(--borde);border-radius:12px;padding:12px 14px;margin:6px 0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.fcliente small{display:block;color:var(--gris);font-size:11px;font-weight:700;letter-spacing:.5px}
.fc1 b{display:block;font-size:19px;line-height:1.2;margin:2px 0}.fc1 span,.fc2 span{display:block;font-size:13px;margin-top:2px}
.fc2{text-align:right;flex:none}.fc2 b{display:block;font-size:17px;color:var(--morado);margin-top:2px}
.fdev{margin:10px 0 0;padding:8px 10px;border:1px dashed #c62828;border-radius:10px}.fdev small{color:#c62828;font-weight:700;font-size:11px;letter-spacing:.5px}
.fvend{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--fondo);border:1px solid var(--borde);border-radius:12px;padding:10px 14px;margin-top:16px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.fvend small{display:block;color:var(--gris);font-size:11px;font-weight:700;letter-spacing:.5px}.fvend b{font-size:16px}.fvend span{color:var(--morado);font-weight:700;font-size:14px}
@media print{body{background:#fff}#app,#toast,.noprint{display:none!important}.modal{position:static;background:#fff}.sheet{max-height:none;overflow:visible;border-radius:0;padding:0}}
</style>

<body>
<div id="app"></div>
<div id="toast"></div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail, reauthenticateWithCredential, EmailAuthProvider, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, collection, query, where, getDocs, onSnapshot, writeBatch, increment, arrayUnion, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============ 1) PEGA AQUÍ LAS CLAVES DE TU PROYECTO FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyDLyoxPpBtvCQprn37KQ-Wfx-gQBLVGSKY",
  authDomain: "emunah-aa4b8.firebaseapp.com",
  projectId: "emunah-aa4b8",
  storageBucket: "emunah-aa4b8.firebasestorage.app",
  messagingSenderId: "898228583964",
  appId: "1:898228583964:web:3bdfa388453305788ce9d9"
};
/* ========================================================================= */

const NEGOCIO = "Emunáh";
const DEF_CATS = ["Comida", "Dulcería", "Atunes", "Aceites", "Traperos", "Otros"];
const METODOS = ["Efectivo", "Nequi", "Daviplata", "Transferencia", "Otro"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => new Intl.NumberFormat("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 }).format(n || 0);
const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const hora = ts => new Date(ts).toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });
const fh = ts => new Date(ts).toLocaleString("es-CO", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
const cod = p => p.numero || String(p.id || "").slice(0, 6).toUpperCase();
/* Sin internet los cambios quedan guardados en el celular y suben solos al conectarse: no hay que esperar la respuesta del servidor */
const esperar = p => { if (navigator.onLine) return p; p.catch(() => {}); return Promise.resolve(); };
const miNombre = () => esJefe() ? (/administrador/i.test(S.perfil.nombre) ? S.perfil.nombre : S.perfil.nombre + " administrador") : S.perfil.nombre;
const sumaDias = n => { const d = new Date(); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const mesDe = d => (d || hoy()).slice(0, 7);
const fdd = d => d ? d.split("-").reverse().join("/") : "";
const etiquetaDia = d => d === hoy() ? "Hoy · " + fdd(d) : d === sumaDias(1) ? "Mañana · " + fdd(d) : d === sumaDias(-1) ? "Ayer · " + fdd(d) : fdd(d);
const totalEntregado = p => p.estado === "entregado" && p.totalEntregado != null ? p.totalEntregado : p.total;
const itemsFinales = p => p.estado === "entregado" && p.itemsEntregados ? p.itemsEntregados : p.items;
const sum = a => a.reduce((t, x) => t + (x.total || 0), 0);
const pantalla = html => { $("#app").innerHTML = html; };
const esJefe = () => S.perfil && S.perfil.role === "jefe";
const cats = () => [...new Set([...DEF_CATS, ...S.productos.map(p => p.categoria).filter(Boolean)])];
const mapa = p => p.lat != null ? `https://www.google.com/maps?q=${p.lat},${p.lng}` : (p.direccion ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.direccion)}` : "");
const pillEstado = p => p.estado === "pendiente" ? '<span class="pill warn">Pendiente</span>'
  : p.estado === "cancelado" ? '<span class="pill off">Cancelado</span>'
  : p.saldo > 0 ? `<span class="pill warn">Debe ${money(p.saldo)}</span>` : '<span class="pill ok">Pagado</span>';

let toastT;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("on"), 3000);
}

function errAuth(e) {
  const c = (e && e.code) || "";
  if (c === "ya-existe") return "Ese correo ya existe en Firebase. Escribe la clave que tenía antes o bórralo en Firebase → Authentication.";
  if (c === "ya-en-equipo") return "Esa persona ya está en el equipo.";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return "Correo o clave incorrectos.";
  if (c.includes("email-already-in-use")) return "Ese correo ya está registrado.";
  if (c.includes("weak-password")) return "La clave debe tener mínimo 6 caracteres.";
  if (c.includes("invalid-email")) return "Correo no válido.";
  if (c.includes("too-many-requests")) return "Demasiados intentos. Espera un momento.";
  if (c.includes("network")) return "Sin conexión a internet.";
  if (c.includes("permission-denied")) return "Sin permisos: revisa que las reglas de Firestore estén publicadas.";
  return "Error: " + ((e && e.message) || c);
}

const S = {
  perfil: null, productos: [], clientes: [], carrito: {}, clienteSel: "", nota: "",
  tab: "pedido", fecha: hoy(), busca: "", cat: "Todas", pbusca: "", pcat: "Todas",
  mcart: null, cbusca: "", qcli: "", fentrega: sumaDias(2), mes: mesDe(), modoCierre: "dia", pend: [], docsCierre: [], registrando: false, unsub: null
};
let auth, db;

function modal(html) {
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="sheet">${html}</div>`;
  m.onclick = e => { if (e.target === m) m.remove(); };
  document.body.appendChild(m);
  return m;
}

/* ---------------------------- LOGIN ---------------------------- */
async function vistaLogin(msg = "") {
  let hayNegocio = true;
  try {
    hayNegocio = (await getDoc(doc(db, "config", "negocio"))).exists();
  } catch (e) {
    msg = msg || errAuth(e);
  }
  pantalla(`
    <div class="login">
      <div class="logo">E</div>
      <h1>${NEGOCIO}</h1>
      <p class="sub">Pedidos, entregas e inventario</p>
      <div id="msg" class="err">${esc(msg)}</div>
      <form id="f-login">
        <input id="l-mail" type="email" placeholder="Correo" autocomplete="username" required>
        <input id="l-pass" type="password" placeholder="Clave" autocomplete="current-password" required>
        <button class="btn">Ingresar</button>
      </form>
      ${hayNegocio ? "" : `
      <hr>
      <p class="sub">Primera vez: crea la cuenta del jefe</p>
      <form id="f-jefe">
        <input id="j-nom" placeholder="Tu nombre" required>
        <input id="j-mail" type="email" placeholder="Tu correo" required>
        <input id="j-pass" type="password" placeholder="Clave (mínimo 6)" minlength="6" required autocomplete="new-password">
        <button class="btn" style="background:var(--naranja)">Crear cuenta de jefe</button>
      </form>`}
    </div>`);

  $("#f-login").onsubmit = async e => {
    e.preventDefault();
    try {
      await signInWithEmailAndPassword(auth, $("#l-mail").value.trim(), $("#l-pass").value);
    } catch (er) {
      $("#msg").textContent = errAuth(er);
    }
  };

  if (!hayNegocio) {
    $("#f-jefe").onsubmit = async e => {
      e.preventDefault();
      const nombre = $("#j-nom").value.trim();
      const email = $("#j-mail").value.trim();
      S.registrando = true;
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, $("#j-pass").value);
        const b = writeBatch(db);
        b.set(doc(db, "config", "negocio"), { nombre: NEGOCIO, jefe: cred.user.uid, creado: Date.now() });
        b.set(doc(db, "users", cred.user.uid), { nombre, email, role: "jefe", active: true, creado: Date.now() });
        await esperar(b.commit());
        S.registrando = false;
        await entrar(cred.user);
      } catch (er) {
        S.registrando = false;
        $("#msg").textContent = errAuth(er);
      }
    };
  }
}

function vistaBloqueado(msg) {
  pantalla(`
    <div class="login">
      <div class="logo">E</div>
      <h1>${NEGOCIO}</h1>
      <p class="err">${esc(msg)}</p>
      <button id="salir2" class="btn">Salir</button>
    </div>`);
  $("#salir2").onclick = () => signOut(auth);
}

async function entrar(u) {
  try {
    const snap = await getDoc(doc(db, "users", u.uid));
    if (!snap.exists()) return vistaBloqueado("Tu cuenta no tiene acceso. Pídele al jefe que te cree el usuario.");
    if (snap.data().active === false) return vistaBloqueado("Tu cuenta está desactivada. Habla con el jefe.");
    S.perfil = { uid: u.uid, ...snap.data() };
    S.tab = "pedido";
    S.carrito = {};
    S.clientes = [];
    S.clienteSel = "";
    S.nota = "";
    S.fecha = hoy();
    S.busca = ""; S.cat = "Todas"; S.pbusca = ""; S.pcat = "Todas"; S.cbusca = ""; S.qcli = ""; S.fentrega = sumaDias(2); S.mes = mesDe(); S.modoCierre = "dia";
    if (S.unsub) S.unsub();
    const u1 = onSnapshot(collection(db, "productos"), q => {
      S.productos = q.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
      refrescar();
    }, e => toast(errAuth(e)));
    const u2 = onSnapshot(collection(db, "clientes"), q => {
      S.clientes = q.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
      refrescarClientes();
    }, e => toast(errAuth(e)));
    S.unsub = () => { u1(); u2(); };
    vistaApp();
    setTimeout(numerarPendientes, 3000);
  } catch (e) {
    vistaBloqueado(errAuth(e));
  }
}

/* Los pedidos hechos sin internet reciben su número A000xx real al reconectarse */
let numerando = false;
async function numerarPendientes() {
  if (numerando || !S.perfil || !navigator.onLine) return;
  numerando = true;
  try {
    const s = await getDocs(query(collection(db, "pedidos"), where("uid", "==", S.perfil.uid), where("numeroPendiente", "==", true)));
    const l = s.docs.sort((a, b) => a.data().ts - b.data().ts);
    for (const d of l) {
      await runTransaction(db, async tx => {
        const cref = doc(db, "config", "contador");
        const cs = await tx.get(cref);
        const n = (cs.exists() ? cs.data().n : 0) + 1;
        tx.set(cref, { n });
        tx.update(d.ref, { numero: "A" + String(n).padStart(5, "0"), numeroPendiente: false });
      });
    }
    if (l.length) { toast(l.length + " pedido(s) sincronizado(s) con su número de factura"); if (S.tab === "entregas") cargarEntregas(); }
  } catch (e) { /* se reintenta luego */ }
  numerando = false;
}
window.addEventListener("online", () => { toast("Conexión recuperada: sincronizando…"); setTimeout(numerarPendientes, 2500); });
window.addEventListener("offline", () => toast("Sin internet: puedes seguir trabajando, todo se subirá al conectarte."));

/* ---------------------------- FOTO DEL PRODUCTO ---------------------------- */
function modalFoto(id) {
  const p = S.productos.find(x => x.id === id);
  if (!p) return;
  const SZ = 280;
  let img = null;
  const st = { z: 1, x: 0, y: 0, b: 100, c: 100 };
  const m = modal(`
    <h3>Foto de ${esc(p.nombre)}</h3>
    <label class="btn" style="display:block;text-align:center;margin:6px 0;cursor:pointer">📷 Tomar o elegir foto<input id="f-file" type="file" accept="image/*" style="display:none"></label>
    <div style="text-align:center"><canvas id="f-cv" width="${SZ}" height="${SZ}" style="width:${SZ}px;max-width:100%;border:1px solid var(--borde);border-radius:14px;background:#f3f4f6"></canvas></div>
    <div id="f-ctl" style="display:none">
      <label>Zoom</label><input id="f-z" type="range" min="1" max="3" step="0.05" value="1">
      <label>Mover izquierda / derecha</label><input id="f-x" type="range" min="-1" max="1" step="0.02" value="0">
      <label>Mover arriba / abajo</label><input id="f-y" type="range" min="-1" max="1" step="0.02" value="0">
      <label>Brillo</label><input id="f-b" type="range" min="70" max="150" step="1" value="100">
      <label>Contraste</label><input id="f-c" type="range" min="70" max="150" step="1" value="100">
      <button id="f-ok" class="btn">Guardar foto</button>
    </div>
    ${p.foto ? '<button id="f-del" class="danger">Quitar foto actual</button>' : ""}
    <button id="f-x2" class="ghost" style="width:100%;margin-top:6px">Cancelar</button>`);
  const cv = m.querySelector("#f-cv");
  const dibujar = (c, n) => {
    const x = c.getContext("2d");
    x.fillStyle = "#fff";
    x.fillRect(0, 0, n, n);
    if (!img) return;
    x.filter = `brightness(${st.b}%) contrast(${st.c}%)`;
    const sc = Math.max(n / img.width, n / img.height) * st.z;
    const dw = img.width * sc, dh = img.height * sc;
    x.drawImage(img, (n - dw) / 2 + st.x * (dw - n) / 2, (n - dh) / 2 + st.y * (dh - n) / 2, dw, dh);
    x.filter = "none";
  };
  const redib = () => dibujar(cv, SZ);
  m.querySelector("#f-x2").onclick = () => m.remove();
  m.querySelector("#f-file").onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const im = new Image();
    im.onload = () => { img = im; m.querySelector("#f-ctl").style.display = "block"; redib(); };
    im.onerror = () => toast("No se pudo abrir esa imagen.");
    im.src = URL.createObjectURL(f);
  };
  [["z", "f-z"], ["x", "f-x"], ["y", "f-y"], ["b", "f-b"], ["c", "f-c"]].forEach(([k, i]) => { m.querySelector("#" + i).oninput = e => { st[k] = Number(e.target.value); redib(); }; });
  m.querySelector("#f-ok").onclick = async () => {
    const out = document.createElement("canvas");
    out.width = out.height = 400;
    dibujar(out, 400);
    const d = out.toDataURL("image/jpeg", 0.72);
    try {
      const b = writeBatch(db);
      b.set(doc(db, "fotos", id), { d, v: Date.now() });
      b.update(doc(db, "productos", id), { foto: true, fotoV: Date.now() });
      await esperar(b.commit());
      m.remove();
      toast("Foto guardada");
    } catch (e) { toast(errAuth(e)); }
  };
  if (p.foto) m.querySelector("#f-del").onclick = async () => {
    if (!confirm("¿Quitar la foto de este producto?")) return;
    try {
      const b = writeBatch(db);
      b.delete(doc(db, "fotos", id));
      b.update(doc(db, "productos", id), { foto: false });
      await esperar(b.commit());
      m.remove();
      toast("Foto eliminada");
    } catch (e) { toast(errAuth(e)); }
  };
}

async function cargarQR() {
  if (window.qrcode) return window.qrcode;
  await new Promise((ok, mal) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
    sc.onload = ok;
    sc.onerror = () => mal(new Error("No se pudo generar el QR. Revisa tu internet."));
    document.head.appendChild(sc);
  });
  return window.qrcode;
}

function formCliente(id) {
  const c = id ? S.clientes.find(x => x.id === id) : { nombre: "", telefono: "", direccion: "", lat: null, lng: null };
  let lat = c.lat ?? null, lng = c.lng ?? null;
  const m = modal(`
    <h3>${id ? "Editar" : "Nuevo"} cliente</h3>
    <form id="fc">
      <input id="c-n" placeholder="Nombre del cliente o negocio" value="${esc(c.nombre)}" required>
      <input id="c-t" type="tel" inputmode="tel" placeholder="Teléfono / WhatsApp" value="${esc(c.telefono)}">
      <input id="c-d" placeholder="Dirección o referencia" value="${esc(c.direccion)}">
      <button type="button" id="c-gps" class="ghost" style="width:100%;margin:6px 0">📍 Usar mi ubicación actual</button>
      <div id="c-ub" style="font-size:14px;color:var(--gris);margin:4px 0 8px"></div>
      <button class="btn">Guardar cliente</button>
      ${id && esJefe() ? '<button type="button" id="c-del" class="danger">Eliminar cliente</button>' : ""}
      <button type="button" id="c-x" class="ghost" style="width:100%">Cancelar</button>
    </form>`);
  const ub = () => {
    m.querySelector("#c-ub").innerHTML = lat != null
      ? `✅ Ubicación guardada · <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" rel="noopener">ver en el mapa</a>`
      : "Sin ubicación guardada. Si estás donde el cliente, toca el botón de arriba.";
  };
  ub();
  m.querySelector("#c-x").onclick = () => m.remove();
  if (id && esJefe()) m.querySelector("#c-del").onclick = async () => {
    try {
      const s = await getDocs(query(collection(db, "pedidos"), where("clienteId", "==", id)));
      const datos = s.docs.map(d => d.data());
      const debe = datos.reduce((t, x) => t + (x.saldo || 0), 0);
      const pend = datos.filter(x => x.estado === "pendiente").length;
      let aviso = "¿Eliminar a " + c.nombre + "? Sus pedidos anteriores se conservan en el historial.";
      if (debe > 0) aviso += "\n\n⚠️ Este cliente debe " + money(debe) + " (fiado). Esa deuda seguirá apareciendo en la pestaña Fiado.";
      if (pend > 0) aviso += "\n\n⚠️ Tiene " + pend + " pedido(s) pendiente(s) de entrega.";
      if (!confirm(aviso)) return;
      await esperar(deleteDoc(doc(db, "clientes", id)));
      if (S.clienteSel === id) S.clienteSel = "";
      m.remove();
      toast("Cliente eliminado");
      await cargarClientes();
      renderCliSel();
      renderClientes();
    } catch (er) { toast(errAuth(er)); }
  };
  m.querySelector("#c-gps").onclick = () => {
    if (!navigator.geolocation) return toast("Este celular no permite obtener la ubicación.");
    toast("Buscando ubicación…");
    navigator.geolocation.getCurrentPosition(pos => {
      lat = Math.round(pos.coords.latitude * 1e6) / 1e6;
      lng = Math.round(pos.coords.longitude * 1e6) / 1e6;
      ub();
      toast("Ubicación capturada (±" + Math.round(pos.coords.accuracy) + " m)");
    }, err => {
      toast(err.code === 1 ? "Permiso de ubicación denegado. Actívalo para este sitio en el navegador." : "No se pudo obtener la ubicación. Intenta de nuevo.");
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  };
  m.querySelector("#fc").onsubmit = async e => {
    e.preventDefault();
    const data = {
      nombre: m.querySelector("#c-n").value.trim(),
      telefono: m.querySelector("#c-t").value.trim(),
      direccion: m.querySelector("#c-d").value.trim(),
      lat, lng
    };
    try {
      if (id) {
        await esperar(updateDoc(doc(db, "clientes", id), data));
      } else {
        const ref = doc(collection(db, "clientes"));
        await esperar(setDoc(ref, { ...data, creadoPor: S.perfil.uid, creadoPorNombre: S.perfil.nombre, creado: Date.now() }));
        S.clienteSel = ref.id;
      }
      m.remove();
      toast("Cliente guardado");
      await cargarClientes();
      renderCliSel();
      renderClientes();
    } catch (er) { toast(errAuth(er)); }
  };
}

function renderLista() {
  const el = $("#lista");
  if (!el) return;
  const q = S.busca.trim().toLowerCase();
  const l = S.productos.filter(p => (S.cat === "Todas" || p.categoria === S.cat) && p.nombre.toLowerCase().includes(q));
  el.innerHTML = l.length ? l.map(p => {
    const en = S.carrito[p.id] || 0;
    const sin = (p.stock || 0) <= 0;
    return `<div class="card prod ${sin ? "sin" : ""}" data-id="${p.id}">
      <div><b>${esc(p.nombre)}</b><small>${esc(p.categoria)} · Stock: ${p.stock || 0}</small></div>
      <div class="precio">${money(p.precio)}${en ? `<span class="badge">${en}</span>` : ""}</div>
    </div>`;
  }).join("") : `<p class="vacio">${S.productos.length ? "Sin resultados." : "Aún no hay productos. El jefe puede crearlos o importarlos en la pestaña Productos."}</p>`;
  el.onclick = e => { const c = e.target.closest(".prod"); if (c) agregar(c.dataset.id, 1); };
}

function agregar(id, n) {
  const p = S.productos.find(x => x.id === id);
  if (!p) return;
  const nuevo = (S.carrito[id] || 0) + n;
  if (nuevo <= 0) delete S.carrito[id];
  else {
    S.carrito[id] = nuevo;
    if (n > 0 && nuevo > (p.stock || 0)) toast("Ojo: solo hay " + (p.stock || 0) + " en stock de " + p.nombre);
  }
  renderLista();
  renderCarrito();
}

const idsCarrito = () => Object.keys(S.carrito).filter(id => S.productos.some(p => p.id === id));

function renderCarrito() {
  const el = $("#carrito");
  if (S.mcart && !document.body.contains(S.mcart)) S.mcart = null;
  if (S.mcart) pintarCarrito();
  if (!el) return;
  const ids = idsCarrito();
  if (!ids.length) { el.innerHTML = ""; return; }
  let total = 0, un = 0;
  ids.forEach(id => { const p = S.productos.find(x => x.id === id); total += S.carrito[id] * p.precio; un += S.carrito[id]; });
  el.innerHTML = `<div class="cartbar"><div><b>🛒 ${ids.length} producto(s) · ${un} unid.</b><span>${money(total)}</span></div><button id="vercart" class="btn">Ver pedido ›</button></div>`;
  $("#vercart").onclick = abrirCarrito;
}

function abrirCarrito() {
  S.mcart = modal('<div id="mc"></div>');
  pintarCarrito();
}

function pintarCarrito() {
  const m = S.mcart;
  if (!m) return;
  const ids = idsCarrito();
  if (!ids.length) { m.remove(); S.mcart = null; return; }
  let total = 0;
  const filas = ids.map(id => {
    const p = S.productos.find(x => x.id === id);
    const n = S.carrito[id];
    total += n * p.precio;
    return `<div class="fila"><span>${esc(p.nombre)}</span>
      <span class="qty"><button data-m="${id}">−</button><b>${n}</b><button data-p="${id}">+</button></span>
      <span>${money(n * p.precio)}</span></div>`;
  }).join("");
  const sc = m.querySelector(".sheet");
  const y = sc.scrollTop;
  const nota = S.nota;
  m.querySelector("#mc").innerHTML = `
    <h3>Pedido actual · ${ids.length} producto(s)</h3>
    <div class="cartlist">${filas}</div>
    <div class="total"><span>Total</span><b>${money(total)}</b></div>
    <label style="display:block;font-size:13px;color:var(--gris);margin-top:8px">📅 Fecha de entrega</label><input id="fent" type="date" min="${hoy()}" value="${S.fentrega}">
    <input id="nota" placeholder="Observaciones (opcional)" value="${esc(nota)}">
    <button id="guardar" class="btn">Guardar pedido · ${money(total)}</button>
    <div class="row"><button id="seguir" class="ghost" style="flex:1">+ Seguir agregando</button><button id="vaciar" class="ghost" style="flex:1">Vaciar</button></div>`;
  sc.scrollTop = y;
  m.querySelector("#nota").oninput = e => { S.nota = e.target.value; };
  m.querySelector("#fent").onchange = e => { S.fentrega = e.target.value; };
  m.querySelector("#seguir").onclick = () => { m.remove(); S.mcart = null; };
  m.querySelector("#vaciar").onclick = () => { S.carrito = {}; m.remove(); S.mcart = null; renderLista(); renderCarrito(); };
  m.querySelector("#guardar").onclick = guardarPedido;
  m.querySelector("#mc").onclick = e => {
    const t = e.target;
    if (t.dataset.m) agregar(t.dataset.m, -1);
    else if (t.dataset.p) agregar(t.dataset.p, 1);
  };
}

async function guardarPedido() {
  const cli = S.clientes.find(c => c.id === S.clienteSel);
  if (!cli) return toast("Elige o crea un cliente primero.");
  if (!S.fentrega || S.fentrega < hoy()) return toast("Elige una fecha de entrega (hoy o después).");
  const items = [];
  let total = 0;
  for (const id of Object.keys(S.carrito)) {
    const p = S.productos.find(x => x.id === id);
    if (!p) continue;
    const n = S.carrito[id];
    items.push({ id, nombre: p.nombre, precio: p.precio, cantidad: n });
    total += n * p.precio;
  }
  if (!items.length) return;
  const btn = $("#guardar");
  if (btn) btn.disabled = true;
  try {
    const data = {
      uid: S.perfil.uid, vendedor: miNombre(), vendedorTel: S.perfil.telefono || "",
      clienteId: cli.id, cliente: cli.nombre, telefono: cli.telefono || "", direccion: cli.direccion || "",
      lat: cli.lat ?? null, lng: cli.lng ?? null,
      items, total, nota: S.nota.trim(),
      estado: "pendiente", pagado: 0, saldo: 0, pagos: [],
      dia: hoy(), mes: mesDe(hoy()), fechaEntrega: S.fentrega, ts: Date.now()
    };
    const ref = doc(collection(db, "pedidos"));
    let guardadoOffline = false;
    if (navigator.onLine) {
      try {
        await runTransaction(db, async tx => {
          const cref = doc(db, "config", "contador");
          const cs = await tx.get(cref);
          const n = (cs.exists() ? cs.data().n : 0) + 1;
          data.numero = "A" + String(n).padStart(5, "0");
          tx.set(cref, { n });
          tx.set(ref, data);
        });
      } catch (e) {
        if (navigator.onLine && !/unavailable|network|offline/i.test((e && (e.code || e.message)) || "")) throw e;
        guardadoOffline = true;
      }
    } else guardadoOffline = true;
    if (guardadoOffline) {
      data.numero = "P" + Date.now().toString(36).toUpperCase().slice(-5);
      data.numeroPendiente = true;
      await esperar(setDoc(ref, data));
    }
    if (S.mcart) { S.mcart.remove(); S.mcart = null; }
    S.carrito = {};
    S.nota = "";
    S.clienteSel = ""; S.qcli = "";
    S.fentrega = sumaDias(2);
    renderLista();
    renderCarrito();
    renderCliSel();
    toast(guardadoOffline ? "Pedido guardado sin internet. Subirá solo cuando te conectes." : "Pedido guardado");
    factura({ id: ref.id, ...data });
  } catch (e) {
    toast(errAuth(e));
    if (btn) btn.disabled = false;
  }
}

/* ---------------------------- FACTURA ---------------------------- */
const EMPRESA = { razon: "Distribuidora Emunáh SAS", dir: "Manzana G Casa 28", barrio: "Barrio Arcamonika", tel: "300-5606030" };
const fd = ts => new Date(ts).toLocaleDateString("es-CO", { day: "2-digit", month: "2-digit", year: "numeric" });

/* Productos que el cliente devolvió al recibir el pedido */
const devolucionesDe = p => {
  if (p.estado !== "entregado" || !p.itemsEntregados) return [];
  const ent = {};
  p.itemsEntregados.forEach(i => { ent[i.id] = i.cantidad; });
  return p.items.map(i => ({ ...i, cantidad: i.cantidad - (ent[i.id] || 0) })).filter(i => i.cantidad > 0);
};

function descargarBlob(blob, nombre) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* Dibuja la factura como imagen (PNG), de la altura que necesite el pedido */
function facturaCanvas(p) {
  const W = 800, PAD = 40;
  const VERDE = "#2e7d32", MORADO = "#6a1b9a", NARANJA = "#ef6c00", GRIS = "#6b7280", TEXTO = "#1f2937", BORDE = "#e5e7eb", ROJO = "#c62828";
  const F = (px, w = 400) => `${w} ${px}px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif`;
  const pend = p.estado === "pendiente", ent = p.estado === "entregado";
  const items = itemsFinales(p);
  const devs = devolucionesDe(p);
  const totalFinal = totalEntregado(p);
  const unidades = items.reduce((t, i) => t + i.cantidad, 0);

  const cortar = (ctx, t, maxW, font) => {
    ctx.font = font;
    let s = String(t);
    if (ctx.measureText(s).width <= maxW) return s;
    while (s.length > 1 && ctx.measureText(s + "…").width > maxW) s = s.slice(0, -1);
    return s + "…";
  };
  const envolver = (ctx, txt, maxW, maxLin, font) => {
    ctx.font = font;
    const lineas = [];
    let cur = "";
    for (const w of String(txt).split(/\s+/)) {
      const t = cur ? cur + " " + w : w;
      if (!cur || ctx.measureText(t).width <= maxW) cur = t;
      else { lineas.push(cur); cur = w; }
    }
    if (cur) lineas.push(cur);
    if (lineas.length > maxLin) { lineas.length = maxLin; lineas[maxLin - 1] += "…"; }
    return lineas.map(l => cortar(ctx, l, maxW, font));
  };
  const rr = (ctx, x, y, w, h, r) => {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };
  const T = (ctx, txt, x, y, font, color, align = "left") => {
    ctx.font = font;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = "top";
    ctx.fillText(txt, x, y);
  };

  const dibujar = ctx => {
    /* Encabezado */
    const g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, VERDE);
    g.addColorStop(1, MORADO);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, 120);
    ctx.fillStyle = NARANJA;
    ctx.fillRect(0, 120, W, 6);
    ctx.fillStyle = "rgba(255,255,255,0.2)";
    rr(ctx, PAD, 26, 68, 68, 18);
    ctx.fill();
    T(ctx, "E", PAD + 34, 40, F(40, 800), "#fff", "center");
    T(ctx, NEGOCIO, PAD + 88, 26, F(34, 800), "#fff");
    T(ctx, EMPRESA.razon, PAD + 88, 70, F(15), "rgba(255,255,255,0.9)");
    T(ctx, "FACTURA", W - PAD, 20, F(13, 700), "rgba(255,255,255,0.85)", "right");
    T(ctx, "No. " + cod(p), W - PAD, 38, F(30, 800), "#fff", "right");
    T(ctx, "Fecha: " + fd(p.ts), W - PAD, 80, F(15), "rgba(255,255,255,0.9)", "right");
    T(ctx, `${EMPRESA.dir} · ${EMPRESA.barrio} · Tel. ${EMPRESA.tel}`, W / 2, 142, F(14), GRIS, "center");

    /* Cliente (arriba, bien visible) y fecha de entrega */
    let y = 176;
    const nomC = envolver(ctx, p.cliente, 450, 2, F(24, 800));
    const extC = [...(p.direccion ? envolver(ctx, p.direccion, 450, 2, F(15)) : []), ...(p.telefono ? ["Tel: " + p.telefono] : [])];
    const bh = Math.max(34 + nomC.length * 30 + extC.length * 21 + 14, 96);
    ctx.fillStyle = "#f7f7f4";
    rr(ctx, PAD, y, W - 2 * PAD, bh, 14);
    ctx.fill();
    ctx.strokeStyle = BORDE;
    ctx.lineWidth = 1;
    rr(ctx, PAD, y, W - 2 * PAD, bh, 14);
    ctx.stroke();
    T(ctx, "CLIENTE", PAD + 18, y + 14, F(12, 700), GRIS);
    let yy = y + 34;
    nomC.forEach(l => { T(ctx, l, PAD + 18, yy, F(24, 800), TEXTO); yy += 30; });
    extC.forEach(l => { T(ctx, l, PAD + 18, yy, F(15), TEXTO); yy += 21; });
    T(ctx, "FECHA DE ENTREGA", W - PAD - 18, y + 14, F(12, 700), GRIS, "right");
    T(ctx, p.fechaEntrega ? fdd(p.fechaEntrega) : "Por definir", W - PAD - 18, y + 34, F(22, 800), MORADO, "right");
    if (ent && p.diaEntrega) T(ctx, "Entregado el " + fdd(p.diaEntrega), W - PAD - 18, y + 66, F(14, 700), VERDE, "right");
    y += bh + 18;

    /* Estado con casillas */
    T(ctx, "ESTADO", PAD, y + 6, F(12, 700), GRIS);
    const casilla = (x, on, etiqueta) => {
      if (on) {
        ctx.fillStyle = VERDE;
        rr(ctx, x, y, 24, 24, 6);
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(x + 6, y + 12.5);
        ctx.lineTo(x + 10.5, y + 17);
        ctx.lineTo(x + 18, y + 7);
        ctx.stroke();
      } else {
        ctx.strokeStyle = MORADO;
        ctx.lineWidth = 2.5;
        rr(ctx, x + 1, y + 1, 22, 22, 6);
        ctx.stroke();
      }
      T(ctx, etiqueta, x + 34, y + 3, F(16, on ? 700 : 400), TEXTO);
    };
    casilla(PAD + 90, pend, "Pendiente de entrega");
    casilla(PAD + 390, ent, "Entregado");
    if (p.estado === "cancelado") T(ctx, "CANCELADO", W - PAD, y + 3, F(16, 800), ROJO, "right");
    y += 24 + 22;

    /* Tabla de productos */
    ctx.fillStyle = "#f3e5f5";
    rr(ctx, PAD, y, W - 2 * PAD, 34, 8);
    ctx.fill();
    T(ctx, "ITEM", PAD + 14, y + 11, F(12, 700), MORADO);
    T(ctx, "CANT.", 430, y + 11, F(12, 700), MORADO, "center");
    T(ctx, "PRECIO", 585, y + 11, F(12, 700), MORADO, "right");
    T(ctx, "VALOR TOTAL", W - PAD - 14, y + 11, F(12, 700), MORADO, "right");
    y += 34;
    items.forEach((i, k) => {
      const lin = envolver(ctx, i.nombre, 340, 2, F(16));
      const h = lin.length * 21 + 18;
      if (k % 2) { ctx.fillStyle = "#faf7fb"; ctx.fillRect(PAD, y, W - 2 * PAD, h); }
      lin.forEach((l, n) => T(ctx, l, PAD + 14, y + 9 + n * 21, F(16), TEXTO));
      T(ctx, String(i.cantidad), 430, y + 9, F(16, 700), TEXTO, "center");
      T(ctx, money(i.precio), 585, y + 9, F(15), GRIS, "right");
      T(ctx, money(i.cantidad * i.precio), W - PAD - 14, y + 9, F(16, 700), TEXTO, "right");
      ctx.fillStyle = BORDE;
      ctx.fillRect(PAD, y + h - 1, W - 2 * PAD, 1);
      y += h;
    });

    /* Devoluciones */
    if (devs.length) {
      y += 16;
      T(ctx, "DEVOLUCIONES", PAD + 14, y, F(12, 700), ROJO);
      y += 20;
      devs.forEach(d => {
        T(ctx, `−${d.cantidad}× ${cortar(ctx, d.nombre, 480, F(14))}`, PAD + 14, y, F(14), ROJO);
        T(ctx, "−" + money(d.cantidad * d.precio), W - PAD - 14, y, F(14, 700), ROJO, "right");
        y += 22;
      });
    }

    /* Totales */
    y += 18;
    T(ctx, `${items.length} producto(s) · ${unidades} unidad(es)`, PAD, y + (p.devuelto > 0 ? 40 : 24), F(15), GRIS);
    const bx = W - PAD - 320;
    if (p.devuelto > 0) {
      T(ctx, "Total del pedido (vendido)", bx + 18, y, F(14), GRIS);
      T(ctx, money(p.total), bx + 302, y, F(14, 700), TEXTO, "right");
      y += 22;
      T(ctx, "Devolución", bx + 18, y, F(14), GRIS);
      T(ctx, "−" + money(p.devuelto), bx + 302, y, F(14, 700), ROJO, "right");
      y += 26;
    }
    ctx.fillStyle = "#fff3e0";
    rr(ctx, bx, y, 320, 66, 14);
    ctx.fill();
    T(ctx, p.devuelto > 0 ? "TOTAL ENTREGADO" : "TOTAL", bx + 18, y + 14, F(12, 700), NARANJA);
    T(ctx, money(totalFinal), bx + 302, y + 16, F(32, 800), NARANJA, "right");
    y += 66;
    if (ent) {
      y += 14;
      T(ctx, "Pagado", bx + 18, y, F(15), GRIS);
      T(ctx, money(p.pagado), bx + 302, y, F(15, 700), VERDE, "right");
      y += 24;
      T(ctx, "Saldo pendiente", bx + 18, y, F(15), GRIS);
      T(ctx, money(p.saldo), bx + 302, y, F(15, 700), p.saldo > 0 ? NARANJA : VERDE, "right");
      y += 22;
    }
    if (p.nota) {
      y += 22;
      T(ctx, "OBSERVACIONES", PAD, y, F(12, 700), GRIS);
      y += 18;
      envolver(ctx, p.nota, W - 2 * PAD, 3, F(15)).forEach(l => { T(ctx, l, PAD, y, F(15), TEXTO); y += 21; });
    }

    /* Pie: vendedor al final de la factura */
    y += 26;
    ctx.fillStyle = BORDE;
    ctx.fillRect(PAD, y, W - 2 * PAD, 1);
    y += 16;
    ctx.fillStyle = "#f7f7f4";
    rr(ctx, PAD, y, W - 2 * PAD, 64, 12);
    ctx.fill();
    T(ctx, "VENDEDOR", PAD + 18, y + 10, F(12, 700), GRIS);
    T(ctx, cortar(ctx, p.vendedor, 430, F(20, 800)), PAD + 18, y + 30, F(20, 800), TEXTO);
    if (p.vendedorTel) T(ctx, "Tel: " + p.vendedorTel, W - PAD - 18, y + 33, F(16, 700), MORADO, "right");
    y += 64 + 22;
    T(ctx, "¡Gracias por tu compra!", W / 2, y, F(20, 800), MORADO, "center");
    T(ctx, EMPRESA.razon, W / 2, y + 30, F(13), GRIS, "center");
    y += 66;
    ctx.fillStyle = g;
    ctx.fillRect(0, y, W, 8);
    return y + 8;
  };

  const tmp = document.createElement("canvas");
  tmp.width = W;
  tmp.height = 10;
  const H = dibujar(tmp.getContext("2d"));
  const SC = Math.min(2, 15000 / H);
  const c = document.createElement("canvas");
  c.width = Math.round(W * SC);
  c.height = Math.ceil(H * SC);
  const ctx = c.getContext("2d");
  ctx.scale(SC, SC);
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, W, H);
  dibujar(ctx);
  return c;
}

async function facturaBlob(p) {
  const c = facturaCanvas(p);
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  if (!blob) throw new Error("no se pudo crear la imagen");
  return blob;
}

async function compartirFactura(p) {
  try {
    const blob = await facturaBlob(p);
    const nombre = `Factura-Emunah-${cod(p)}.png`;
    const file = new File([blob], nombre, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: `Factura ${NEGOCIO}`, text: `Factura ${cod(p)} · ${p.cliente} · ${money(totalEntregado(p))}` });
        return;
      } catch (e) { if (e && e.name === "AbortError") return; }
    }
    descargarBlob(blob, nombre);
    toast("La imagen se guardó en tu celular. Adjúntala en WhatsApp.");
  } catch (e) { toast("No se pudo crear la factura: " + e.message); }
}

/* ---------------------------- ENTREGAS / MIS PEDIDOS ---------------------------- */
const diaEntregaDe = p => p.fechaEntrega || p.dia || "";

function tabEntregas() {
  $("#main").innerHTML = `
    <div class="row"><b style="flex:1">${esJefe() ? "Pedidos por entregar" : "Mis pedidos pendientes"}</b>${esJefe() ? '<button id="cons" class="ghost">Consolidado</button>' : ""}<button id="act" class="ghost">Actualizar</button></div>
    <div id="entlista"><p class="vacio">Cargando…</p></div>`;
  $("#act").onclick = cargarEntregas;
  if (esJefe()) $("#cons").onclick = () => modalConsolidado();
  cargarEntregas();
}

function tarjetaPedido(p) {
  const m = mapa(p);
  return `<div class="card venta">
    <div class="lin" style="border:0;padding:0"><b>${esc(p.cliente)}</b><b style="color:var(--verde)">${money(p.total)}</b></div>
    <small>#${cod(p)} · pedido ${fh(p.ts)}${esJefe() ? " · " + esc(p.vendedor) : ""}</small>
    <small>${p.items.map(i => `${i.cantidad}× ${esc(i.nombre)}`).join(", ")}</small>
    ${p.direccion ? `<small>📍 ${esc(p.direccion)}</small>` : ""}
    ${p.nota ? `<small>📝 ${esc(p.nota)}</small>` : ""}
    <div class="row" style="flex-wrap:wrap;margin-top:8px">
      <button class="ghost" data-ped="${p.id}" data-act="ver">Factura</button>
      ${m ? `<a class="ghost" href="${m}" target="_blank" rel="noopener">Mapa</a>` : ""}
      ${p.telefono ? `<a class="ghost" href="tel:${esc(p.telefono)}">Llamar</a>` : ""}
      ${esJefe() ? `<button class="btn chico" data-ped="${p.id}" data-act="entregar">Entregar y cobrar</button><button class="ghost" data-ped="${p.id}" data-act="fecha">📅 Fecha</button><button class="ghost" style="color:#c62828" data-ped="${p.id}" data-act="cancelar">Cancelar</button>` : ""}
    </div>
  </div>`;
}

async function cargarEntregas() {
  const el = $("#entlista");
  if (!el) return;
  try {
    const cs = [where("estado", "==", "pendiente")];
    if (!esJefe()) cs.push(where("uid", "==", S.perfil.uid));
    const s = await getDocs(query(collection(db, "pedidos"), ...cs));
    S.pend = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => diaEntregaDe(a).localeCompare(diaEntregaDe(b)) || a.ts - b.ts);
    let html = "", ultimo = null;
    S.pend.forEach(p => {
      const f = diaEntregaDe(p);
      if (f !== ultimo) {
        ultimo = f;
        const grupo = S.pend.filter(x => diaEntregaDe(x) === f);
        html += `<h3 style="margin-top:14px">📅 ${esc(etiquetaDia(f))}${f && f < hoy() ? ' <span class="pill off">Atrasado</span>' : ""} <small style="color:var(--gris);font-weight:400">· ${grupo.length} pedido(s) · ${money(sum(grupo))}</small></h3>`;
      }
      html += tarjetaPedido(p);
    });
    el.innerHTML = html || '<p class="vacio">No hay pedidos pendientes.</p>';
    el.onclick = e => {
      const b = e.target.closest("button[data-ped]");
      if (!b) return;
      const p = S.pend.find(x => x.id === b.dataset.ped);
      if (!p) return;
      if (b.dataset.act === "ver") factura(p);
      else if (b.dataset.act === "entregar") modalEntrega(p);
      else if (b.dataset.act === "fecha") modalFecha(p);
      else if (b.dataset.act === "cancelar") cancelarPedido(p);
    };
  } catch (e) {
    el.innerHTML = `<p class="vacio">${esc(errAuth(e))}</p>`;
  }
}

function modalFecha(p) {
  const m = modal(`
    <h3>Fecha de entrega</h3>
    <small style="color:var(--gris)">${esc(p.cliente)} · #${cod(p)}</small>
    <input id="fe-d" type="date" value="${diaEntregaDe(p)}">
    <button id="fe-ok" class="btn">Guardar fecha</button>
    <button id="fe-x" class="ghost" style="width:100%">Cancelar</button>`);
  m.querySelector("#fe-x").onclick = () => m.remove();
  m.querySelector("#fe-ok").onclick = async () => {
    const f = m.querySelector("#fe-d").value;
    if (!f) return toast("Elige una fecha.");
    try {
      await esperar(updateDoc(doc(db, "pedidos", p.id), { fechaEntrega: f }));
      m.remove();
      toast("Fecha de entrega guardada");
      cargarEntregas();
    } catch (e) { toast(errAuth(e)); }
  };
}

function modalConsolidado(filtro = "todas") {
  const todas = S.pend;
  if (!todas.length) return toast("No hay pedidos pendientes para consolidar.");
  const fechas = [...new Set(todas.map(diaEntregaDe))].sort();
  if (filtro !== "todas" && !fechas.includes(filtro)) filtro = "todas";
  const lista = filtro === "todas" ? todas : todas.filter(p => diaEntregaDe(p) === filtro);
  const acc = {};
  lista.forEach(p => p.items.forEach(i => {
    const a = acc[i.id] = acc[i.id] || { id: i.id, nombre: i.nombre, cantidad: 0, valor: 0 };
    a.cantidad += i.cantidad;
    a.valor += i.cantidad * i.precio;
  }));
  const filas = Object.values(acc).sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
  const unidades = filas.reduce((t, x) => t + x.cantidad, 0);
  const valor = sum(lista);
  const nClientes = new Set(lista.map(p => p.clienteId || p.cliente)).size;
  const cuando = filtro === "todas" ? "Todas las fechas" : etiquetaDia(filtro) + (etiquetaDia(filtro) !== fdd(filtro) ? " (" + fdd(filtro) + ")" : "");
  const falta = f => { const pr = S.productos.find(x => x.id === f.id); return pr ? Math.max(0, f.cantidad - (pr.stock || 0)) : 0; };
  const m = modal(`
    <div class="noprint"><select id="co-f"><option value="todas">Todas las fechas</option>${fechas.map(f => `<option value="${f}" ${f === filtro ? "selected" : ""}>${esc(etiquetaDia(f))}${etiquetaDia(f) !== fdd(f) ? " · " + fdd(f) : ""}</option>`).join("")}</select></div>
    <div class="factura">
      <h3 style="text-align:center;margin:6px 0 0">Consolidado de entregas</h3>
      <small style="display:block;text-align:center;color:var(--gris)">${NEGOCIO} · Entrega: ${esc(cuando)}</small>
      <div class="kpis">${kpi("Pedidos", lista.length)}${kpi("Clientes", nClientes)}${kpi("Unidades", unidades)}${kpi("Valor vendido", money(valor))}</div>
      <h3>Productos a llevar</h3>
      ${filas.map(f => `<div class="lin"><span><b>${f.cantidad}×</b> ${esc(f.nombre)}${falta(f) ? `<span class="pill off">Faltan ${falta(f)}</span>` : ""}</span><span>${money(f.valor)}</span></div>`).join("")}
      <h3 style="margin-top:14px">Pedidos incluidos</h3>
      ${lista.map(p => `<div class="lin"><span>${esc(p.cliente)}${p.direccion ? `<small style="display:block;color:var(--gris)">📍 ${esc(p.direccion)}</small>` : ""}</span><span>${money(p.total)}</span></div>`).join("")}
    </div>
    <div class="noprint acciones">
      <button id="co-wa" class="btn">Compartir por WhatsApp</button>
      <div class="row"><button id="co-pr" class="ghost" style="flex:1">🖨️ Imprimir</button><button id="co-x" class="ghost" style="flex:1">Cerrar</button></div>
    </div>`);
  m.querySelector("#co-f").onchange = e => { m.remove(); modalConsolidado(e.target.value); };
  m.querySelector("#co-x").onclick = () => m.remove();
  m.querySelector("#co-pr").onclick = () => window.print();
  m.querySelector("#co-wa").onclick = () => {
    const txt = `*${NEGOCIO}* — Consolidado de entregas\nEntrega: ${cuando}\n${lista.length} pedidos · ${nClientes} clientes\n\n*Productos a llevar*\n${filas.map(f => `• ${f.cantidad}× ${f.nombre}`).join("\n")}\n\n*Total: ${unidades} unidades · ${money(valor)}*`;
    window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, "_blank");
  };
}

async function cancelarPedido(p) {
  if (!confirm("¿Cancelar el pedido de " + p.cliente + "? No se descuenta stock.")) return;
  try {
    await esperar(updateDoc(doc(db, "pedidos", p.id), { estado: "cancelado", saldo: 0, canceladoTs: Date.now() }));
    toast("Pedido cancelado");
    cargarEntregas();
  } catch (e) { toast(errAuth(e)); }
}

function modalEntrega(p) {
  const cant = {};
  p.items.forEach(i => { cant[i.id] = i.cantidad; });
  const tot = () => p.items.reduce((t, i) => t + cant[i.id] * i.precio, 0);
  const m = modal(`
    <h3>Entregar a ${esc(p.cliente)}</h3>
    <small style="color:var(--gris)">Si el cliente devuelve algo, baja la cantidad. El valor vendido por el vendedor no cambia: solo cambia lo que se entrega y se cobra.</small>
    <div id="en-items" style="margin-top:8px"></div>
    <div id="en-res"></div>
    <select id="en-tipo">
      <option value="completo">Pagó completo</option>
      <option value="parcial">Pagó una parte (el resto queda fiado)</option>
      <option value="fiado">Fiado (no pagó nada)</option>
    </select>
    <input id="en-monto" type="number" inputmode="numeric" min="1" placeholder="¿Cuánto pagó?" style="display:none">
    <select id="en-metodo">${METODOS.map(x => `<option>${x}</option>`).join("")}</select>
    <button id="en-ok" class="btn">Confirmar entrega</button>
    <button id="en-x" class="ghost" style="width:100%">Cancelar</button>`);
  const tipo = m.querySelector("#en-tipo"), monto = m.querySelector("#en-monto"), metodo = m.querySelector("#en-metodo");
  const pintar = () => {
    m.querySelector("#en-items").innerHTML = p.items.map(i => `
      <div class="fila"><span>${esc(i.nombre)}${cant[i.id] < i.cantidad ? `<span class="pill off">Dev. ${i.cantidad - cant[i.id]}</span>` : ""}</span>
      <span class="qty"><button data-m="${i.id}">−</button><b>${cant[i.id]}</b><button data-p="${i.id}">+</button></span>
      <span>${money(cant[i.id] * i.precio)}</span></div>`).join("");
    const t = tot();
    m.querySelector("#en-res").innerHTML = `
      <div class="lin"><span>Total vendido</span><b>${money(p.total)}</b></div>
      ${p.total - t > 0 ? `<div class="lin"><span>Devolución</span><b style="color:#c62828">−${money(p.total - t)}</b></div>` : ""}
      <div class="total"><span>Total a cobrar</span><b>${money(t)}</b></div>`;
  };
  pintar();
  m.querySelector("#en-items").onclick = e => {
    const b = e.target.closest("button");
    if (!b) return;
    const id = b.dataset.m || b.dataset.p;
    const orig = p.items.find(i => i.id === id).cantidad;
    cant[id] = Math.max(0, Math.min(orig, cant[id] + (b.dataset.p ? 1 : -1)));
    pintar();
  };
  tipo.onchange = () => {
    monto.style.display = tipo.value === "parcial" ? "block" : "none";
    metodo.style.display = tipo.value === "fiado" ? "none" : "block";
  };
  m.querySelector("#en-x").onclick = () => m.remove();
  m.querySelector("#en-ok").onclick = async () => {
    const totalEnt = tot();
    if (totalEnt <= 0) return toast("Si el cliente devolvió todo, cancela el pedido en lugar de entregarlo.");
    const pago = tipo.value === "completo" ? totalEnt : tipo.value === "fiado" ? 0 : Math.round(Number(monto.value) || 0);
    if (tipo.value === "parcial" && (pago <= 0 || pago >= totalEnt)) return toast("El pago parcial debe ser mayor que 0 y menor que el total a cobrar.");
    const itemsEnt = p.items.filter(i => cant[i.id] > 0).map(i => ({ id: i.id, nombre: i.nombre, precio: i.precio, cantidad: cant[i.id] }));
    const faltan = itemsEnt.filter(i => { const pr = S.productos.find(x => x.id === i.id); return !pr || (pr.stock || 0) < i.cantidad; }).map(i => i.nombre);
    if (faltan.length && !confirm("Stock insuficiente de: " + faltan.join(", ") + ". ¿Entregar igual?")) return;
    const btn = m.querySelector("#en-ok");
    btn.disabled = true;
    try {
      const b = writeBatch(db);
      const ts = Date.now(), dia = hoy();
      const met = metodo.value;
      b.update(doc(db, "pedidos", p.id), {
        estado: "entregado", itemsEntregados: itemsEnt, totalEntregado: totalEnt, devuelto: p.total - totalEnt,
        pagado: pago, pagoEntrega: pago, saldo: totalEnt - pago,
        pagos: pago > 0 ? [{ monto: pago, metodo: met, ts }] : [],
        entregadoTs: ts, diaEntrega: dia, mesEntrega: mesDe(dia)
      });
      itemsEnt.forEach(i => { if (S.productos.some(x => x.id === i.id)) b.update(doc(db, "productos", i.id), { stock: increment(-i.cantidad) }); });
      if (pago > 0) b.set(doc(collection(db, "pagos")), { pedidoId: p.id, clienteId: p.clienteId, cliente: p.cliente, monto: pago, metodo: met, dia, mes: mesDe(dia), ts });
      await esperar(b.commit());
      m.remove();
      toast("Entrega registrada");
      cargarEntregas();
    } catch (e) {
      toast(errAuth(e));
      btn.disabled = false;
    }
  };
}


/* ---------------------------- FIADO (solo jefe) ---------------------------- */
function tabFiado() {
  $("#main").innerHTML = `
    <div class="row"><b style="flex:1">Clientes que deben</b><button id="act" class="ghost">Actualizar</button></div>
    <div id="flista"><p class="vacio">Cargando…</p></div>`;
  $("#act").onclick = cargarFiado;
  cargarFiado();
}

async function cargarFiado() {
  const el = $("#flista");
  if (!el) return;
  try {
    const s = await getDocs(query(collection(db, "pedidos"), where("saldo", ">", 0)));
    const g = {};
    s.docs.forEach(d => {
      const p = { id: d.id, ...d.data() };
      const k = p.clienteId || p.cliente;
      g[k] = g[k] || { id: p.clienteId, cliente: p.cliente, telefono: p.telefono, saldo: 0, pedidos: [] };
      g[k].saldo += p.saldo;
      g[k].pedidos.push(p);
    });
    const lista = Object.values(g).sort((a, b) => b.saldo - a.saldo);
    const totalDeuda = lista.reduce((t, x) => t + x.saldo, 0);
    el.innerHTML = lista.length ? `
      <div class="kpis"><div class="kpi grande"><small>Total por cobrar</small><b>${money(totalDeuda)}</b></div></div>
      ${lista.map((x, i) => `<div class="card">
        <div class="lin" style="border:0;padding:0"><b>${esc(x.cliente)}</b><b style="color:var(--naranja)">${money(x.saldo)}</b></div>
        ${x.pedidos.sort((a, b) => a.ts - b.ts).map(p => `<div class="lin"><span>#${cod(p)} · ${fh(p.ts)}</span><span>${money(p.saldo)}</span></div>`).join("")}
        <div class="row" style="margin-top:8px">
          <button class="btn chico" data-i="${i}">Registrar abono</button>
          ${x.telefono ? `<a class="ghost" href="tel:${esc(x.telefono)}">Llamar</a>` : ""}
        </div>
      </div>`).join("")}` : '<p class="vacio">Nadie debe nada. 🎉</p>';
    el.onclick = e => {
      const b = e.target.closest("button[data-i]");
      if (b) abonar(lista[Number(b.dataset.i)]);
    };
  } catch (e) {
    el.innerHTML = `<p class="vacio">${esc(errAuth(e))}</p>`;
  }
}

function abonar(g) {
  const m = modal(`
    <h3>Abono de ${esc(g.cliente)}</h3>
    <div class="total"><span>Debe</span><b>${money(g.saldo)}</b></div>
    <input id="ab-monto" type="number" inputmode="numeric" min="1" max="${g.saldo}" placeholder="¿Cuánto abona?">
    <select id="ab-metodo">${METODOS.map(x => `<option>${x}</option>`).join("")}</select>
    <button id="ab-ok" class="btn">Registrar abono</button>
    <button id="ab-x" class="ghost" style="width:100%">Cancelar</button>`);
  m.querySelector("#ab-x").onclick = () => m.remove();
  m.querySelector("#ab-ok").onclick = async () => {
    let resto = Math.round(Number(m.querySelector("#ab-monto").value) || 0);
    if (resto <= 0 || resto > g.saldo) return toast("Monto no válido (máximo " + money(g.saldo) + ").");
    const met = m.querySelector("#ab-metodo").value;
    const btn = m.querySelector("#ab-ok");
    btn.disabled = true;
    try {
      const b = writeBatch(db);
      const ts = Date.now(), dia = hoy();
      for (const p of g.pedidos.slice().sort((a, b2) => a.ts - b2.ts)) {
        if (resto <= 0) break;
        const ap = Math.min(p.saldo, resto);
        resto -= ap;
        b.update(doc(db, "pedidos", p.id), { pagado: increment(ap), saldo: increment(-ap), pagos: arrayUnion({ monto: ap, metodo: met, ts }) });
        b.set(doc(collection(db, "pagos")), { pedidoId: p.id, clienteId: g.id || "", cliente: g.cliente, monto: ap, metodo: met, dia, mes: mesDe(dia), ts });
      }
      await esperar(b.commit());
      m.remove();
      toast("Abono registrado");
      cargarFiado();
    } catch (e) {
      toast(errAuth(e));
      btn.disabled = false;
    }
  };
}

function renderClientes() {

/*PARSER_CLI_START*/
function parsearClientes(txt) {
  const filas = [];
  let malas = 0;
  String(txt || "").split(/\r?\n/).forEach(l => {
    if (!l.trim()) return;
    const c = l.split(/\t|;|\|/).map(x => x.trim());
    if (!c[0]) { malas++; return; }
    filas.push({ nombre: c[0], telefono: c[1] || "", direccion: c[2] || "" });
  });
  return { filas, malas };
}
/*PARSER_CLI_END*/

/*PARSER_START*/
function limpioNum(s) {
  s = String(s || "").trim().replace(/^\$/, "");
  s = s.replace(/[.,]\d{1,2}$/, "");
  return Math.round(Number(s.replace(/\D/g, "")));
}
function parsearLista(txt) {
  const filas = [];
  let malas = 0;
  String(txt || "").split(/\r?\n/).forEach(l => {
    if (!l.trim()) return;
    const c = l.split(/\t|;|\|/).map(x => x.trim());
    const nombre = c[0];
    const precio = limpioNum(c[2]);
    const stock = limpioNum(c[3]) || 0;
    if (!nombre || !(precio > 0)) { malas++; return; }
    filas.push({ nombre, categoria: c[1] || "Otros", precio, stock });
  });
  return { filas, malas };
}
/*PARSER_END*/

const kpi = (t, v, grande) => `<div class="kpi ${grande ? "grande" : ""}"><small>${t}</small><b>${v}</b></div>`;
const filaPedido = (p, conVend) => `<div class="card venta" data-ped="${p.id}" style="cursor:pointer">
  <div class="lin" style="border:0;padding:0"><b>${esc(p.cliente)}${pillEstado(p)}</b><b style="color:var(--verde)">${money(totalEntregado(p))}</b></div>
  <small>#${cod(p)} · ${fdd(p.dia)} ${hora(p.ts)}${conVend ? " · " + esc(p.vendedor) : ""}${p.fechaEntrega ? " · entrega " + fdd(p.fechaEntrega) : ""}</small>
  <small>${itemsFinales(p).map(i => `${i.cantidad}× ${esc(i.nombre)}`).join(", ")}</small>
  ${p.devuelto > 0 ? `<small style="color:#c62828">Devolución −${money(p.devuelto)} (vendido ${money(p.total)})</small>` : ""}
</div>`;
const bloquePares = (titulo, pares) => pares.length ? `<div class="card"><h3>${titulo}</h3>${pares.map(([n, t]) => `<div class="lin"><span>${esc(n)}</span><b>${money(t)}</b></div>`).join("")}</div>` : "";
const agrupar = (arr, clave, valor) => {
  const m = {};
  arr.forEach(x => { m[x[clave]] = (m[x[clave]] || 0) + valor(x); });
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
};
const porDia = (arr, clave, valor) => {
  const m = {};
  arr.forEach(x => { if (x[clave]) m[x[clave]] = (m[x[clave]] || 0) + valor(x); });
  return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0])).map(([d, t]) => [fdd(d), t]);
};

async function cargarCierre() {
  const el = $("#cierre");
  if (!el) return;
  const dia = S.modoCierre === "dia";
  const per = (cDia, cMes) => [where(dia ? cDia : cMes, "==", dia ? S.fecha : S.mes)];
  const lee = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
  const cuando = dia ? "del día" : "del mes";
  try {
    if (!esJefe()) {
      const s = await getDocs(query(collection(db, "pedidos"), ...per("dia", "mes"), where("uid", "==", S.perfil.uid)));
      const v = lee(s).sort((a, b) => b.ts - a.ts);
      const act = v.filter(x => x.estado !== "cancelado");
      const ent = act.filter(x => x.estado === "entregado");
      const pen = act.filter(x => x.estado === "pendiente");
      S.docsCierre = v;
      el.innerHTML = `<div class="kpis">
        ${kpi("Valor vendido " + cuando, money(sum(act)), true)}
        ${kpi("Pedidos tomados", act.length)}
        ${kpi("Entregados", ent.length)}
        ${kpi("Pendientes de entrega", pen.length)}
        ${kpi("Valor entregado", money(ent.reduce((t, x) => t + totalEntregado(x), 0)))}
        ${kpi("Devoluciones", money(ent.reduce((t, x) => t + (x.devuelto || 0), 0)))}
      </div>
      ${dia ? "" : bloquePares("Vendido por día", porDia(act, "dia", x => x.total))}
      <h3>${dia ? "Mis pedidos del día" : "Mis pedidos del mes" + (v.length > 60 ? " (los 60 más recientes)" : "")}</h3>
      ${v.length ? v.slice(0, 60).map(p => filaPedido(p, false)).join("") : '<p class="vacio">No hay pedidos en este periodo.</p>'}`;
    } else {
      const [cr, en, pg, de, pe] = await Promise.all([
        getDocs(query(collection(db, "pedidos"), ...per("dia", "mes"))),
        getDocs(query(collection(db, "pedidos"), ...per("diaEntrega", "mesEntrega"))),
        getDocs(query(collection(db, "pagos"), ...per("dia", "mes"))),
        getDocs(query(collection(db, "pedidos"), where("saldo", ">", 0))),
        getDocs(query(collection(db, "pedidos"), where("estado", "==", "pendiente")))
      ]);
      const creados = lee(cr).filter(x => x.estado !== "cancelado").sort((a, b) => b.ts - a.ts);
      const entregas = lee(en).filter(x => x.estado === "entregado").sort((a, b) => b.entregadoTs - a.entregadoTs);
      const pagos = lee(pg);
      const deudas = lee(de);
      const pendientes = lee(pe);
      const cobrado = pagos.reduce((t, x) => t + x.monto, 0);
      const valorEnt = entregas.reduce((t, x) => t + totalEntregado(x), 0);
      const devol = entregas.reduce((t, x) => t + (x.devuelto || 0), 0);
      const fiadoPer = entregas.reduce((t, x) => t + (totalEntregado(x) - (x.pagoEntrega || 0)), 0);
      S.docsCierre = [...creados, ...entregas];
      el.innerHTML = `<div class="kpis">
        ${kpi("Dinero cobrado " + cuando, money(cobrado), true)}
        ${kpi("Vendido por vendedores", money(sum(creados)))}
        ${kpi("Entregado (valor)", money(valorEnt))}
        ${kpi("Devoluciones", money(devol))}
        ${kpi("Entregas hechas", entregas.length)}
        ${kpi("Fiado " + cuando, money(fiadoPer))}
        ${kpi("Pendiente de entrega", pendientes.length + " · " + money(sum(pendientes)))}
        ${kpi("Fiado total por cobrar", money(deudas.reduce((t, x) => t + x.saldo, 0)))}
      </div>
      ${bloquePares("Cobrado por método", agrupar(pagos, "metodo", x => x.monto))}
      ${bloquePares("Vendido por vendedor", agrupar(creados, "vendedor", x => x.total))}
      ${bloquePares("Entregado por vendedor", agrupar(entregas, "vendedor", x => totalEntregado(x)))}
      ${dia ? `
        <h3>Entregas del día</h3>
        ${entregas.length ? entregas.map(p => filaPedido(p, true)).join("") : '<p class="vacio">No hubo entregas.</p>'}
        <h3>Pedidos tomados ese día</h3>
        ${creados.length ? creados.map(p => filaPedido(p, true)).join("") : '<p class="vacio">No se tomaron pedidos.</p>'}`
      : `${bloquePares("Vendido por día", porDia(creados, "dia", x => x.total))}
        ${bloquePares("Entregado por día", porDia(entregas, "diaEntrega", x => totalEntregado(x)))}
        ${bloquePares("Cobrado por día", porDia(pagos, "dia", x => x.monto))}`}`;
    }
    el.onclick = e => {
      const c = e.target.closest("[data-ped]");
      if (!c) return;
      const p = S.docsCierre.find(x => x.id === c.dataset.ped);
      if (p) factura(p);
    };
  } catch (e) {
    el.innerHTML = `<p class="vacio">${esc(errAuth(e))}</p>`;
  }
}

    <button id="xl-ok" class="btn">Descargar</button>
    <button id="xl-x" class="ghost" style="width:100%">Cancelar</button>`);
  const todo = m.querySelector("#xl-todo"), d = m.querySelector("#xl-d"), h = m.querySelector("#xl-h");
  todo.onchange = () => { d.disabled = h.disabled = todo.checked; };
  m.querySelector("#xl-x").onclick = () => m.remove();
  m.querySelector("#xl-ok").onclick = async () => {
    const btn = m.querySelector("#xl-ok");
    if (!todo.checked && (!d.value || !h.value || d.value > h.value)) return toast("Revisa las fechas: la inicial debe ser menor o igual a la final.");
    btn.disabled = true;
    btn.textContent = "Preparando…";
    try {
      await exportarExcel(todo.checked ? "" : d.value, todo.checked ? "" : h.value);
      m.remove();
      toast("Excel descargado");
    } catch (e) {
      toast(errAuth(e));
      btn.disabled = false;
      btn.textContent = "Descargar";
    }
  };
}

async function exportarExcel(desde, hasta) {
  const XLSX = await cargarXLSX();
  const [sp, sg, su] = await Promise.all([getDocs(collection(db, "pedidos")), getDocs(collection(db, "pagos")), getDocs(collection(db, "users"))]);
  const dentro = d => (!desde || d >= desde) && (!hasta || d <= hasta);
  const todosPed = sp.docs.map(d => ({ id: d.id, ...d.data() }));
  const peds = todosPed.filter(p => dentro(p.dia || "")).sort((a, b) => a.ts - b.ts);
  const pagos = sg.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => dentro(x.dia || "")).sort((a, b) => a.ts - b.ts);
  const num = new Map(todosPed.map(p => [p.id, cod(p)]));
  const estadoTxt = p => p.estado === "pendiente" ? "Pendiente de entrega" : p.estado === "entregado" ? "Entregado" : "Cancelado";
  const entVal = p => p.estado === "entregado" ? totalEntregado(p) : 0;
  const act = peds.filter(p => p.estado !== "cancelado");
  const ent = act.filter(p => p.estado === "entregado");
  const pen = act.filter(p => p.estado === "pendiente");

  const hoja = (aoa, anchos, moneda = []) => {
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = anchos.map(w => ({ wch: w }));
    if (ws["!ref"]) {
      const rng = XLSX.utils.decode_range(ws["!ref"]);
      for (let R = 1; R <= rng.e.r; R++) for (const C of moneda) {
        const c = ws[XLSX.utils.encode_cell({ r: R, c: C })];
        if (c && typeof c.v === "number") c.z = '"$"#,##0';
      }
    }
    return ws;
  };

  /* Resumen general + por vendedor */
  const resumen = [
    ["RESUMEN " + NEGOCIO.toUpperCase()],
    ["Periodo (pedidos tomados)", desde ? `${fdd(desde)} a ${fdd(hasta)}` : "Todo el historial"],
    ["Generado", new Date().toLocaleString("es-CO")],
    [],
    ["Concepto", "Valor"]
  ];
  const filasDinero = [];
  const linea = (k, v, esDinero) => { resumen.push([k, v]); if (esDinero) filasDinero.push(resumen.length - 1); };
  linea("Pedidos tomados (sin cancelados)", act.length);
  linea("Valor vendido por los vendedores", sum(act), true);
  linea("Pedidos entregados", ent.length);
  linea("Valor entregado", ent.reduce((t, p) => t + totalEntregado(p), 0), true);
  linea("Devoluciones (valor)", ent.reduce((t, p) => t + (p.devuelto || 0), 0), true);
  linea("Pedidos pendientes de entrega", pen.length);
  linea("Valor pendiente de entrega", sum(pen), true);
  linea("Pedidos cancelados", peds.filter(p => p.estado === "cancelado").length);
  linea("Dinero cobrado en el periodo", pagos.reduce((t, x) => t + x.monto, 0), true);
  linea("Fiado por cobrar de estos pedidos", ent.reduce((t, p) => t + (p.saldo || 0), 0), true);
  resumen.push([], ["POR VENDEDOR"], ["Vendedor", "Pedidos", "Valor vendido", "Entregados", "Valor entregado", "Devoluciones", "Pendientes", "Fiado por cobrar"]);
  const vend = [...new Set(act.map(p => p.vendedor))].sort((a, b) => String(a).localeCompare(String(b), "es"));
  const filaVend0 = resumen.length;
  vend.forEach(n => {
    const a = act.filter(p => p.vendedor === n), e = a.filter(p => p.estado === "entregado");
    resumen.push([n, a.length, sum(a), e.length, e.reduce((t, p) => t + totalEntregado(p), 0), e.reduce((t, p) => t + (p.devuelto || 0), 0), a.filter(p => p.estado === "pendiente").length, e.reduce((t, p) => t + (p.saldo || 0), 0)]);
  });
  const wsRes = hoja(resumen, [38, 18, 18, 14, 18, 16, 12, 18]);
  filasDinero.forEach(r => { const c = wsRes[XLSX.utils.encode_cell({ r, c: 1 })]; if (c) c.z = '"$"#,##0'; });
  for (let r = filaVend0; r < resumen.length; r++) for (const c of [2, 4, 5, 7]) { const cell = wsRes[XLSX.utils.encode_cell({ r, c })]; if (cell && typeof cell.v === "number") cell.z = '"$"#,##0'; }

  /* Pedidos */
  const wsPed = hoja([
    ["N° factura", "Fecha pedido", "Entrega programada", "Entrega real", "Cliente", "Teléfono", "Dirección", "Vendedor", "Estado", "Valor vendido", "Valor entregado", "Devolución", "Pagado", "Saldo (fiado)", "Observaciones"],
    ...peds.map(p => [cod(p), fdd(p.dia), fdd(p.fechaEntrega), fdd(p.diaEntrega), p.cliente, p.telefono || "", p.direccion || "", p.vendedor, estadoTxt(p), p.total, entVal(p), p.estado === "entregado" ? (p.devuelto || 0) : 0, p.pagado || 0, p.saldo || 0, p.nota || ""])
  ], [12, 12, 16, 12, 30, 14, 32, 22, 20, 14, 14, 12, 12, 12, 30], [9, 10, 11, 12, 13]);

  /* Detalle de productos */
  const det = [["N° factura", "Fecha pedido", "Cliente", "Vendedor", "Estado", "Producto", "Cant. vendida", "Cant. entregada", "Cant. devuelta", "Precio", "Valor vendido", "Valor entregado"]];
  peds.forEach(p => {
    const entMap = {};
    if (p.estado === "entregado") (p.itemsEntregados || p.items).forEach(i => { entMap[i.id] = i.cantidad; });
    p.items.forEach(i => {
      const ce = p.estado === "entregado" ? (entMap[i.id] || 0) : 0;
      det.push([cod(p), fdd(p.dia), p.cliente, p.vendedor, estadoTxt(p), i.nombre, i.cantidad, ce, p.estado === "entregado" ? i.cantidad - ce : 0, i.precio, i.cantidad * i.precio, ce * i.precio]);
    });
  });
  const wsDet = hoja(det, [12, 12, 30, 22, 20, 40, 13, 14, 13, 12, 14, 14], [9, 10, 11]);

  /* Pagos */
  const wsPag = hoja([
    ["Fecha", "Hora", "N° factura", "Cliente", "Monto", "Método"],
    ...pagos.map(x => [fdd(x.dia), new Date(x.ts).toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" }), num.get(x.pedidoId) || "", x.cliente, x.monto, x.metodo])
  ], [12, 10, 12, 32, 14, 16], [4]);

  /* Fiado (siempre completo) */
  const fi = {};
  todosPed.filter(p => p.saldo > 0).forEach(p => {
    const k = p.clienteId || p.cliente;
    fi[k] = fi[k] || { cliente: p.cliente, tel: p.telefono || "", saldo: 0, n: 0 };
    fi[k].saldo += p.saldo;
    fi[k].n += 1;
  });
  const wsFi = hoja([["Cliente", "Teléfono", "Saldo por cobrar", "Pedidos con saldo"], ...Object.values(fi).sort((a, b) => b.saldo - a.saldo).map(x => [x.cliente, x.tel, x.saldo, x.n])], [34, 16, 18, 16], [2]);

  /* Inventario, clientes, equipo */
  const wsInv = hoja([["Producto", "Categoría", "Precio", "Stock", "Valor en inventario"], ...S.productos.map(p => [p.nombre, p.categoria, p.precio, p.stock || 0, (p.precio || 0) * (p.stock || 0)])], [44, 16, 12, 10, 18], [2, 4]);
  const wsCli = hoja([["Cliente", "Teléfono", "Dirección", "Latitud", "Longitud", "Creado por"], ...S.clientes.map(c => [c.nombre, c.telefono || "", c.direccion || "", c.lat ?? "", c.lng ?? "", c.creadoPorNombre || ""])], [34, 16, 36, 12, 12, 22]);
  const wsEq = hoja([["Nombre", "Correo", "Teléfono", "Rol", "Estado"], ...su.docs.map(d => d.data()).map(u => [u.nombre, u.email, u.telefono || "", u.role === "jefe" ? "Administrador" : "Vendedor", u.active === false ? "Desactivado" : "Activo"])], [26, 30, 16, 12, 14]);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsRes, "Resumen");
  XLSX.utils.book_append_sheet(wb, wsPed, "Pedidos");
  XLSX.utils.book_append_sheet(wb, wsDet, "Detalle productos");
  XLSX.utils.book_append_sheet(wb, wsPag, "Pagos");
  XLSX.utils.book_append_sheet(wb, wsFi, "Fiado");
  XLSX.utils.book_append_sheet(wb, wsInv, "Inventario");
  XLSX.utils.book_append_sheet(wb, wsCli, "Clientes");
  XLSX.utils.book_append_sheet(wb, wsEq, "Equipo");
  XLSX.writeFile(wb, `Emunah-resumen-${hoy()}.xlsx`);
}

/* ---------------------------- EQUIPO + RESPALDO (solo jefe) ---------------------------- */
function descargarCSV(nombre, filas) {
  const csv = filas.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${nombre}-${hoy()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

async function respaldo(tipo) {
  try {
    if (tipo === "productos") {
      descargarCSV("productos", [["Nombre", "Categoría", "Precio", "Stock"], ...S.productos.map(p => [p.nombre, p.categoria, p.precio, p.stock])]);
    } else if (tipo === "clientes") {
      const s = await getDocs(collection(db, "clientes"));
      descargarCSV("clientes", [["Nombre", "Teléfono", "Dirección", "Latitud", "Longitud", "Creado por"], ...s.docs.map(d => { const c = d.data(); return [c.nombre, c.telefono, c.direccion, c.lat, c.lng, c.creadoPorNombre]; })]);
    } else {
      const s = await getDocs(collection(db, "pedidos"));
      const v = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.ts - b.ts);
      descargarCSV("pedidos", [["Fecha", "Pedido", "Cliente", "Vendedor", "Estado", "Total", "Pagado", "Saldo", "Productos"], ...v.map(p => [fh(p.ts), cod(p), p.cliente, p.vendedor, p.estado, p.total, p.pagado, p.saldo, p.items.map(i => `${i.cantidad}x ${i.nombre}`).join(" | ")])]);
    }
    toast("Copia descargada");
  } catch (e) { toast(errAuth(e)); }
}

function tabEquipo() {
  $("#main").innerHTML = `
    <div class="card"><h3>Nuevo vendedor</h3>
      <form id="fe">
        <input id="e-n" placeholder="Nombre" required>
        <input id="e-t" type="tel" inputmode="tel" placeholder="Teléfono (opcional, sale en las facturas)">
        <input id="e-m" type="email" placeholder="Correo" required>
        <input id="e-p" type="text" placeholder="Clave inicial (mínimo 6)" minlength="6" required autocomplete="off">
        <button class="btn">Crear vendedor</button>
      </form>
    </div>
    <h3>Equipo</h3>
    <div id="eqlista"><p class="vacio">Cargando…</p></div>
    <div class="card"><h3>Copia de seguridad</h3>
      <small style="color:var(--gris)">Descarga tus datos en archivos que abre Excel. Hazlo cada semana.</small>
      <button id="xl2" class="btn" style="background:var(--morado);margin:8px 0">📥 Descargar Excel completo</button>
      <div class="row" style="flex-wrap:wrap;margin-top:8px">
        <button class="ghost" data-r="productos">Productos</button>
        <button class="ghost" data-r="clientes">Clientes</button>
        <button class="ghost" data-r="pedidos">Pedidos</button>
      </div>
    </div>`;
  $("#xl2").onclick = modalExcel;
  document.querySelectorAll("[data-r]").forEach(b => { b.onclick = () => respaldo(b.dataset.r); });
  $("#fe").onsubmit = async e => {
    e.preventDefault();
    const nombre = $("#e-n").value.trim();
    const tel = $("#e-t").value.trim();
    const email = $("#e-m").value.trim();
    const pass = $("#e-p").value;
    const btn = e.target.querySelector("button");
    btn.disabled = true;
    try {
      const sec = getApps().find(a => a.name === "sec") || initializeApp(firebaseConfig, "sec");
      const secAuth = getAuth(sec);
      let cred;
      try {
        cred = await createUserWithEmailAndPassword(secAuth, email, pass);
      } catch (er0) {
        if (!((er0.code || "").includes("email-already-in-use"))) throw er0;
        try { cred = await signInWithEmailAndPassword(secAuth, email, pass); }
        catch (er1) { throw { code: "ya-existe" }; }
        if ((await getDoc(doc(db, "users", cred.user.uid))).exists()) { await signOut(secAuth); throw { code: "ya-en-equipo" }; }
      }
      await setDoc(doc(db, "users", cred.user.uid), { nombre, email, telefono: tel, role: "vendedor", active: true, creado: Date.now() });
      await signOut(secAuth);
      e.target.reset();
      toast("Vendedor creado. Pásale su correo y clave.");
      cargarEquipo();
    } catch (er) {
      toast(errAuth(er));
    }
    btn.disabled = false;
  };
  cargarEquipo();
}

async function cargarEquipo() {
  const el = $("#eqlista");
  if (!el) return;
  try {
    const s = await getDocs(collection(db, "users"));
    const u = s.docs.map(d => ({ uid: d.id, ...d.data() })).sort((a, b) => (a.role === "jefe" ? -1 : 1) - (b.role === "jefe" ? -1 : 1) || a.nombre.localeCompare(b.nombre, "es"));
    el.innerHTML = u.map(x => `
      <div class="card">
        <div class="lin" style="border:0;padding:0"><b>${esc(x.nombre)}<span class="pill ${x.active === false ? "off" : ""}">${x.role === "jefe" ? "Administrador" : x.active === false ? "Desactivado" : "Vendedor"}</span></b></div>
        <small style="color:var(--gris)">${esc(x.email)}${x.telefono ? " · 📞 " + esc(x.telefono) : ""}</small>
        <div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="ghost" data-act="tel" data-uid="${x.uid}" data-tel="${esc(x.telefono || "")}">📞 Teléfono</button>${x.uid !== S.perfil.uid ? `
          <button class="ghost" data-act="toggle" data-uid="${x.uid}" data-on="${x.active === false ? 1 : 0}">${x.active === false ? "Activar" : "Desactivar"}</button>
          <button class="ghost" data-act="reset" data-mail="${esc(x.email)}">Restablecer clave</button>
          <button class="ghost" style="color:#c62828" data-act="del" data-uid="${x.uid}" data-nombre="${esc(x.nombre)}">Eliminar</button>
        ` : ""}</div>
      </div>`).join("");
    el.onclick = async e => {
      const b = e.target.closest("button[data-act]");
      if (!b) return;
      try {
        if (b.dataset.act === "tel") {
          const t = prompt("Teléfono (sale en las facturas):", b.dataset.tel || "");
          if (t === null) return;
          await updateDoc(doc(db, "users", b.dataset.uid), { telefono: t.trim() });
          if (b.dataset.uid === S.perfil.uid) S.perfil.telefono = t.trim();
          toast("Teléfono guardado");
          cargarEquipo();
        } else if (b.dataset.act === "del") {
          if (!confirm("¿Eliminar a " + b.dataset.nombre + " del equipo? Ya no podrá entrar a la app. Sus pedidos anteriores se conservan en el historial.")) return;
          await deleteDoc(doc(db, "users", b.dataset.uid));
          toast("Vendedor eliminado");
          cargarEquipo();
        } else if (b.dataset.act === "toggle") {
          await updateDoc(doc(db, "users", b.dataset.uid), { active: b.dataset.on === "1" });
          cargarEquipo();
        } else {
          await sendPasswordResetEmail(auth, b.dataset.mail);
          toast("Se envió un correo para cambiar la clave.");
        }
      } catch (er) { toast(errAuth(er)); }
    };
  } catch (e) {
    el.innerHTML = `<p class="vacio">${esc(errAuth(e))}</p>`;
  }
}
