<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<title>Emunáh · Tienda</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--verde:#2e7d32;--naranja:#ef6c00;--morado:#6a1b9a;--fondo:#f6f5f2;--borde:#e5e7eb;--gris:#6b7280;--texto:#1f2937}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto)}
header{background:linear-gradient(135deg,var(--verde),var(--morado));color:#fff;padding:22px 16px 26px;text-align:center;border-bottom:5px solid var(--naranja)}
.logo{width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,.2);display:inline-flex;align-items:center;justify-content:center;font-size:36px;font-weight:800}
header h1{margin:8px 0 2px;font-size:28px}header p{margin:0;opacity:.9;font-size:14px}
main{max-width:760px;margin:0 auto;padding:12px 10px 130px}
.buscar{position:relative;margin:4px 0 10px}.buscar span{position:absolute;left:14px;top:50%;transform:translateY(-50%)}
input,textarea{width:100%;padding:12px 14px;border:1px solid var(--borde);border-radius:12px;font-size:16px;background:#fff;font-family:inherit;margin-bottom:8px}
.buscar input{padding-left:42px;margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chip{flex:none;border:1px solid var(--borde);background:#fff;border-radius:20px;padding:8px 14px;font-size:14px;color:var(--texto)}
.chip.on{background:var(--morado);color:#fff;border-color:var(--morado)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.p{background:#fff;border:1px solid var(--borde);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
/* Foto cuadrada y grande: se ve COMPLETA (sin recortar) */
.img{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:800;color:#fff;background-color:#fff;background-repeat:no-repeat;background-position:center;background-size:contain;border-bottom:1px solid var(--borde)}
.img[data-z]{cursor:zoom-in}
.pb{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.cat{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--morado)}
.pb b{font-size:13px;line-height:1.25;font-weight:700}
.desc{font-size:11px;line-height:1.3;color:var(--gris);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.precio{font-size:16px;font-weight:800;color:var(--verde);margin-top:auto;padding-top:4px}
.add{border:0;border-radius:10px;background:var(--naranja);color:#fff;font-weight:700;padding:10px;font-size:15px}
.add[disabled]{background:#cbd5e1}
.qty{display:flex;align-items:center;justify-content:space-between;background:#fff3e0;border-radius:10px;padding:3px}
.qty button{width:38px;height:36px;border:0;border-radius:8px;background:var(--naranja);color:#fff;font-size:20px;font-weight:700}
.qty b{font-size:16px}
.bar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:740px;margin:0 auto;background:#fff;border:2px solid var(--naranja);border-radius:16px;padding:8px 8px 8px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:5}
.bar b{display:block;font-size:13px}.bar span{font-size:19px;font-weight:800;color:var(--naranja)}
.btn{border:0;border-radius:12px;background:var(--verde);color:#fff;font-weight:700;padding:13px 18px;font-size:16px;width:100%}
.bar .btn{width:auto}
.ghost{border:1px solid var(--morado);background:#fff;color:var(--morado);border-radius:12px;padding:11px;font-weight:600;font-size:15px;width:100%;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:16px;max-height:92vh;overflow:auto}
.fila{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--borde);font-size:14px}
.fila .qty{gap:6px;background:none}.fila .qty button{width:30px;height:30px;font-size:17px}
.lista{max-height:38vh;overflow:auto}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:12px 0}.total b{color:var(--naranja)}
.vacio{text-align:center;color:var(--gris);padding:30px 10px}
h3{margin:4px 0 8px}label{font-size:13px;color:var(--gris)}
.ok{text-align:center;padding:10px 0}.ok .tick{font-size:54px}
footer{text-align:center;color:var(--gris);font-size:12px;padding:6px 0 20px}
/* Foto ampliada */
.luz{max-width:520px;text-align:center;padding-top:10px}
.luz .gr{width:100%;aspect-ratio:1/1;max-height:62vh;margin:0 auto 8px;background-color:#fff;background-repeat:no-repeat;background-position:center;background-size:contain;border-radius:14px;border:1px solid var(--borde)}
.luz h3{font-size:17px;margin:4px 0}
.luz .d{font-size:13px;color:var(--gris);margin:0 0 6px;line-height:1.35}
.luz .precio{font-size:22px;padding:2px 0 8px}
.luz .x{float:right;border:0;background:#f3f4f6;border-radius:50%;width:36px;height:36px;font-size:18px}
</style>
</head>
<body>
<header><div class="logo">E</div><h1>Emunáh</h1><p>Distribuidora · Haz tu pedido aquí y te confirmamos por WhatsApp</p></header>
<main>
  <div class="buscar"><span>🔍</span><input id="q" type="search" placeholder="Buscar producto…"></div>
  <div class="chips" id="chips"></div>
  <div id="lista" class="grid"><p class="vacio">Cargando catálogo…</p></div>
  <footer>Distribuidora Emunáh SAS · Tel. 300-5606030</footer>
</main>
<div id="barra"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, onSnapshot, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDLyoxPpBtvCQprn37KQ-Wfx-gQBLVGSKY",
  authDomain: "emunah-aa4b8.firebaseapp.com",
  projectId: "emunah-aa4b8",
  storageBucket: "emunah-aa4b8.firebasestorage.app",
  messagingSenderId: "898228583964",
  appId: "1:898228583964:web:3bdfa388453305788ce9d9"
};
const WA = "573005606030";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => new Intl.NumberFormat("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 }).format(n || 0);
const COL = ["#2e7d32", "#6a1b9a", "#ef6c00", "#0277bd", "#ad1457", "#00796b"];
const db = getFirestore(initializeApp(firebaseConfig));
const fotos = {};
let prods = [], cat = "Todas", busca = "", carro = {}, modalEl = null, luzId = null, luzEl = null;
try { carro = JSON.parse(localStorage.getItem("emunah_carro") || "{}"); } catch (e) {}
const guardarCarro = () => { try { localStorage.setItem("emunah_carro", JSON.stringify(carro)); } catch (e) {} };
const cats = () => ["Todas", ...new Set(prods.map(p => p.categoria).filter(Boolean))];
const fotoDe = p => fotos[p.id] || p.imagen || "";
const accion = p => {
  const n = carro[p.id] || 0, sin = (p.stock || 0) <= 0;
  return sin ? '<button class="add" disabled>Agotado</button>' : n ? `<div class="qty"><button data-m="${p.id}">−</button><b>${n}</b><button data-p="${p.id}">+</button></div>` : `<button class="add" data-p="${p.id}">Agregar</button>`;
};

function pintar() {
  $("#chips").innerHTML = cats().map(c => `<button class="chip ${c === cat ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  const q = busca.trim().toLowerCase();
  const l = prods.filter(p => (cat === "Todas" || p.categoria === cat) && p.nombre.toLowerCase().includes(q));
  $("#lista").innerHTML = l.length ? l.map(p => {
    const col = COL[[...(p.categoria || "x")].reduce((t, c) => t + c.charCodeAt(0), 0) % COL.length];
    const f = fotoDe(p);
    const img = f ? `style="background-image:url('${esc(f)}')" data-z="${p.id}"` : `style="background:linear-gradient(135deg,${col},${col}cc)"`;
    return `<div class="p"><div class="img" ${img} ${p.foto && !f ? `data-f="${p.id}"` : ""}>${f ? "" : esc(p.nombre.trim().charAt(0).toUpperCase())}</div>
      <div class="pb"><span class="cat">${esc(p.categoria || "")}</span><b>${esc(p.nombre)}</b>${p.descripcion ? `<span class="desc">${esc(p.descripcion)}</span>` : ""}
      <div class="precio">${money(p.precio)}</div>
      ${accion(p)}
      </div></div>`;
  }).join("") : `<p class="vacio" style="grid-column:1/-1">${prods.length ? "No hay productos con ese nombre." : "El catálogo se está actualizando. Vuelve pronto."}</p>`;
  barra();
  vigilar();
}
const obs = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { obs.unobserve(e.target); traer(e.target.dataset.f); } }), { rootMargin: "200px" }) : null;
function vigilar() { document.querySelectorAll(".img[data-f]").forEach(el => obs ? obs.observe(el) : traer(el.dataset.f)); }
async function traer(id) {
  if (fotos[id] !== undefined) return;
  fotos[id] = "";
  try { const d = await getDoc(doc(db, "fotos", id)); if (d.exists()) { fotos[id] = d.data().d; pintar(); if (luzId) luz(); } } catch (e) {}
}
const lineas = () => Object.keys(carro).map(id => ({ p: prods.find(x => x.id === id), n: carro[id] })).filter(x => x.p);
const total = () => lineas().reduce((t, x) => t + x.n * x.p.precio, 0);
function cambiar(id, d) {
  const n = (carro[id] || 0) + d;
  if (n <= 0) delete carro[id]; else carro[id] = Math.min(n, 9999);
  guardarCarro();
  pintar();
  if (modalEl) hoja();
  if (luzId) luz();
}

/* Foto ampliada: toca la foto de un producto para verla en grande */
function ampliar(id) {
  luzId = id;
  if (!luzEl) {
    luzEl = document.createElement("div");
    luzEl.className = "modal";
    luzEl.style.alignItems = "center";
    luzEl.onclick = e => {
      const t = e.target;
      if (t === luzEl || t.dataset.x) return cerrarLuz();
      if (t.dataset.m) cambiar(t.dataset.m, -1); else if (t.dataset.p) cambiar(t.dataset.p, 1);
    };
    document.body.appendChild(luzEl);
  }
  luz();
}
function luz() {
  const p = prods.find(x => x.id === luzId);
  if (!p) return cerrarLuz();
  const f = fotoDe(p);
  luzEl.innerHTML = `<div class="sheet luz" style="border-radius:20px"><button class="x" data-x="1" aria-label="Cerrar">✕</button>
    ${f ? `<div class="gr" style="background-image:url('${esc(f)}')"></div>` : ""}
    <h3>${esc(p.nombre)}</h3>${p.descripcion ? `<p class="d">${esc(p.descripcion)}</p>` : ""}
    <div class="precio">${money(p.precio)}</div>${accion(p)}</div>`;
}
function cerrarLuz() { if (luzEl) luzEl.remove(); luzEl = null; luzId = null; }

function barra() {
  const l = lineas();
  $("#barra").innerHTML = l.length ? `<div class="bar"><div><b>🛒 ${l.length} producto(s) · ${l.reduce((t, x) => t + x.n, 0)} unid.</b><span>${money(total())}</span></div><button class="btn" id="ver">Ver pedido ›</button></div>` : "";
  if (l.length) $("#ver").onclick = abrir;
}
function abrir() {
  cerrarLuz();
  modalEl = document.createElement("div");
  modalEl.className = "modal";
  modalEl.onclick = e => { if (e.target === modalEl) cerrar(); };
  modalEl.innerHTML = '<div class="sheet" id="sh"></div>';
  document.body.appendChild(modalEl);
  hoja();
}
const cerrar = () => { if (modalEl) modalEl.remove(); modalEl = null; };
const rec = k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };
function hoja() {
  const l = lineas();
  if (!l.length) return cerrar();
  const sh = $("#sh"), y = sh.scrollTop;
  const v = id => (modalEl.querySelector("#" + id) || {}).value;
  const pre = { n: v("c-n") ?? rec("emunah_n"), w: v("c-w") ?? rec("emunah_w"), d: v("c-d") ?? rec("emunah_d"), o: v("c-o") ?? "" };
  sh.innerHTML = `<h3>Tu pedido</h3>
    <div class="lista">${l.map(x => `<div class="fila"><span>${esc(x.p.nombre)}</span><span class="qty"><button data-m="${x.p.id}">−</button><b>${x.n}</b><button data-p="${x.p.id}">+</button></span><b>${money(x.n * x.p.precio)}</b></div>`).join("")}</div>
    <div class="total"><span>Total</span><b>${money(total())}</b></div>
    <label>Tus datos (para confirmar tu pedido)</label>
    <input id="c-n" placeholder="Tu nombre o el de tu negocio" value="${esc(pre.n)}" autocomplete="name">
    <input id="c-w" type="tel" inputmode="tel" placeholder="Tu número de WhatsApp" value="${esc(pre.w)}" autocomplete="tel">
    <input id="c-d" placeholder="Dirección o barrio de entrega" value="${esc(pre.d)}">
    <textarea id="c-o" rows="2" placeholder="Observaciones (opcional)">${esc(pre.o)}</textarea>
    <button class="btn" id="enviar">Enviar pedido</button>
    <button class="ghost" id="seguir">+ Seguir comprando</button>`;
  sh.scrollTop = y;
  $("#seguir").onclick = cerrar;
  $("#enviar").onclick = enviar;
  sh.onclick = e => { const t = e.target; if (t.dataset.m) cambiar(t.dataset.m, -1); else if (t.dataset.p) cambiar(t.dataset.p, 1); };
}
async function enviar() {
  const nombre = $("#c-n").value.trim(), wa = $("#c-w").value.replace(/[^0-9]/g, ""), dir = $("#c-d").value.trim(), obs = $("#c-o").value.trim();
  if (nombre.length < 2) return alert("Escribe tu nombre.");
  if (wa.length < 10 || wa.length > 13) return alert("Escribe tu número de WhatsApp (10 dígitos).");
  if (!dir) return alert("Escribe la dirección o barrio de entrega.");
  try { localStorage.setItem("emunah_n", nombre); localStorage.setItem("emunah_w", wa); localStorage.setItem("emunah_d", dir); } catch (e) {}
  const l = lineas(), tot = total();
  const btn = $("#enviar");
  btn.disabled = true; btn.textContent = "Enviando…";
  const items = l.map(x => ({ id: x.p.id, nombre: x.p.nombre, precio: x.p.precio, cantidad: x.n }));
  let guardado = true;
  try { await addDoc(collection(db, "pedidosWeb"), { nombre, whatsapp: wa, direccion: dir, nota: obs, items, total: tot, estado: "nuevo", ts: Date.now() }); }
  catch (e) { guardado = false; }
  const txt = `*Nuevo pedido · Emunáh*\nCliente: ${nombre}\nWhatsApp: ${wa}\nDirección: ${dir}\n\n${l.map(x => `• ${x.n}× ${x.p.nombre} — ${money(x.n * x.p.precio)}`).join("\n")}\n\n*Total: ${money(tot)}*${obs ? "\nObservaciones: " + obs : ""}`;
  const url = `https://wa.me/${WA}?text=${encodeURIComponent(txt)}`;
  carro = {}; guardarCarro(); pintar();
  $("#sh").innerHTML = `<div class="ok"><div class="tick">✅</div><h3>${guardado ? "¡Pedido recibido!" : "Casi listo"}</h3>
    <p>${guardado ? "Toca el botón para avisarnos por WhatsApp y confirmar tu pedido." : "No pudimos registrarlo en la tienda, pero puedes enviarlo directo por WhatsApp."}</p>
    <a href="${url}" target="_blank" rel="noopener"><button class="btn" style="background:#25d366">📲 Enviar por WhatsApp</button></a>
    <button class="ghost" id="fin">Cerrar</button></div>`;
  $("#fin").onclick = cerrar;
  try { window.open(url, "_blank"); } catch (e) {}
}
$("#q").oninput = e => { busca = e.target.value; pintar(); };
$("#chips").onclick = e => { const c = e.target.dataset.c; if (c) { cat = c; pintar(); } };
onSnapshot(query(collection(db, "productos"), where("enTienda", "==", true)), s => {
  prods = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
  Object.keys(carro).forEach(id => { if (!prods.some(p => p.id === id)) delete carro[id]; });
  pintar();
}, () => { $("#lista").innerHTML = '<p class="vacio" style="grid-column:1/-1">No pudimos cargar el catálogo. Intenta de nuevo en unos minutos.</p>'; });

$("#lista").onclick = e => {
  const t = e.target;
  if (t.dataset.m) cambiar(t.dataset.m, -1);
  else if (t.dataset.p) cambiar(t.dataset.p, 1);
  else { const z = t.closest("[data-z]"); if (z) ampliar(z.dataset.z); }
};
</script>
</body>
</html>
